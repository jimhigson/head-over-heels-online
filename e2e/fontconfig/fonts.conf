<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Pinned fontconfig for the Linux visual-regression runners, pointed at via
  FONTCONFIG_FILE in the visual-test-setup action.

  Headless chromium resolves its text hinting/antialiasing from a fontconfig
  query at launch (see chromiumFontRenderingLaunchOptions in
  playwright.config.ts). Left to the runner image's own config, that query has
  produced two different text-rasterisation states across otherwise identical
  runners - shifting every glyph by ~1px and changing antialiasing, which is
  enough to push text-dense snapshots (installGuide) over the diff tolerance.

  The values here are the ones the passing runners report (hintslight,
  greyscale-compatible antialiasing, no autohint), so baselines captured
  before this pin remain valid: this forces the majority answer, always.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>

  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
