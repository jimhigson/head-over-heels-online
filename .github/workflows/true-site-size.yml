name: true site size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
          cache: pnpm
      - uses: jimhigson/true-site-size@main
        with:
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm build:game
          serve-dir: dist
          compression: gzip
          # the campaigns db read on menu load returns live data whose size
          # varies over time - exclude it from byte counts (it still appears,
          # tagged, in the run-log breakdown)
          ignore-url-patterns: '["supabase\\.co"]'
          # For release-please PRs, compare against the production branch
          # (= previous release) to show the cumulative change across the
          # whole release rather than the empty diff of a version bump.
          base-ref: ${{ startsWith(github.head_ref, 'release-please--') && 'production' || '' }}
          journey: |
            [
              { "goto": "/?track=0" },
              { "row": "main menu", "mark": "menu-ready" },
              { "click": "[data-menuitem_id=\"playGame\"]" },
              { "click": "[data-menuitem_id=\"originalGame\"]" },
              { "row": "start original campaign", "mark": "first-gameplay" }
            ]
