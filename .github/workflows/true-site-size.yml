name: true site size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
          cache: pnpm
      - uses: jimhigson/true-site-size@main
        with:
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm build:game
          serve-dir: dist
          compression: gzip
          # the campaigns db read on menu load returns live data whose size
          # varies over time - exclude it from byte counts (it still appears,
          # tagged, in the run-log breakdown)
          ignore-url-patterns: '["supabase\\.co"]'
          # temporarily comparing against a baseline branch so this demo PR
          # can show deltas (main has no performance marks yet); remove
          # base-ref once marks are merged to main
          base-ref: true-site-size-baseline
          journey: |
            [
              { "goto": "/?track=0" },
              { "row": "main menu", "mark": "menu-ready" },
              { "click": "[data-menuitem_id=\"playGame\"]" },
              { "click": "[data-menuitem_id=\"originalGame\"]" },
              { "row": "start original campaign", "mark": "first-gameplay" }
            ]
