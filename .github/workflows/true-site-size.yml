name: true site size

on:
  pull_request:
    branches: [main]
  # also run on push to main so an open release PR's report is refreshed to
  # reflect just-merged code (a pull_request run doesn't re-fire when main moves)
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: true-site-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: game
            build-command: pnpm build:game
            journey: |
              [
                { "goto": "/?track=0" },
                { "row": "to menu", "mark": "menu-ready", "emoji": "📋" },
                { "click": "[data-menuitem_id=\"playGame\"]" },
                { "click": "[data-menuitem_id=\"originalGame\"]" },
                { "click": "[data-dialog-id=\"crowns\"]", "afterMark": "first-gameplay" },
                { "waitForGone": "[data-dialog-id=\"crowns\"]" },
                { "row": "to game", "mark": "first-gameplay", "emoji": "🎮" },
                { "keys": "M" },
                { "row": "open map", "mark": "open map", "emoji": "🗺️" }
              ]
          - target: editor
            build-command: pnpm build:editor
            # the editor builds into dist/editor and serves from /editor/
            journey: |
              [
                { "goto": "/editor/" },
                { "row": "editor", "marks": ["editor-monaco-ready", "editor-map-ready"], "emoji": "🛠️" }
              ]
    name: ${{ matrix.target }} size
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
          cache: pnpm
      # GitHub's hosted ubuntu-latest runner ships with Google Chrome
      # preinstalled, so this step is a no-op in CI. It exists only so the
      # workflow can also be run locally with `act` whose runner images
      # don't contain a browser
      - name: Ensure Chrome is installed (for local `act` runs)
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1 \
            || command -v google-chrome-stable >/dev/null 2>&1 \
            || command -v chromium >/dev/null 2>&1 \
            || command -v chromium-browser >/dev/null 2>&1; then
            echo "Chrome/Chromium already present - nothing to install"
          else
            echo "No browser on PATH - installing Google Chrome for the size journey"
            deb="$(mktemp --suffix=.deb)"
            curl -fsSL -o "$deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y "$deb"
            rm -f "$deb"
            # `act` runs steps as root, and Chrome refuses to run as root with
            # its sandbox enabled ("Running as root without --no-sandbox is not
            # supported"). Point CHROME_PATH at a wrapper that adds --no-sandbox
            # so the journey can launch. This is only set in this act-only
            # branch, so CI keeps using sandboxed Chrome as the non-root runner.
            wrapper=/usr/local/bin/chrome-no-sandbox
            printf '#!/usr/bin/env bash\nexec /usr/bin/google-chrome-stable --no-sandbox "$@"\n' | sudo tee "$wrapper" >/dev/null
            sudo chmod +x "$wrapper"
            echo "CHROME_PATH=$wrapper" >> "$GITHUB_ENV"
          fi
      # on push to main, find the open release PR whose report to refresh
      - id: release-pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --base main --json number,headRefName \
                --jq 'map(select(.headRefName | startswith("release-please--")))[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      # the release before the current production tag, for a third historical
      # comparison point (production's own size delta at the last release)
      - id: prev-production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --json tagName,isDraft,isPrerelease --limit 10 \
                --jq '[.[] | select(.isDraft==false and .isPrerelease==false)][1].tagName // empty')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: base-refs
        env:
          IS_RELEASE_PLEASE_PR: ${{ startsWith(github.head_ref, 'release-please--') }}
          PREV_PRODUCTION_TAG: ${{ steps.prev-production.outputs.tag }}
        run: |
          refs=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$IS_RELEASE_PLEASE_PR" != "true" ]; then
            refs+=("main")
          fi
          refs+=("production")
          if [ -n "$PREV_PRODUCTION_TAG" ]; then
            refs+=("$PREV_PRODUCTION_TAG")
          fi
          json=$(printf '%s\n' "${refs[@]}" | jq -R . | jq -sc .)
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - uses: jimhigson/true-site-size@main
        if: github.event_name == 'pull_request'
        with:
          comment-key: ${{ matrix.target }}
          install-command: pnpm install --frozen-lockfile
          clean-command: pnpm clean:ci
          build-command: ${{ matrix.build-command }}
          serve-dir: dist
          compression: br
          compression-level: 11
          ignore-url-patterns: '["supabase\\.co"]'
          minimum-change-threshold: 50
          # a normal PR compares vs main (its merge target), production (the
          # last release) and the release before that. a release-please PR
          # only bumps the build number over main, so a vs-main comparison is
          # meaningless noise - it omits main and compares vs the two releases
          # alone.
          base-refs: ${{ steps.base-refs.outputs.json }}
          journey: ${{ matrix.journey }}
      - uses: jimhigson/true-site-size@main
        if: github.event_name == 'push' && steps.release-pr.outputs.number != ''
        with:
          comment-key: ${{ matrix.target }}
          install-command: pnpm install --frozen-lockfile
          clean-command: pnpm clean:ci
          build-command: ${{ matrix.build-command }}
          serve-dir: dist
          compression: br
          compression-level: 11
          ignore-url-patterns: '["supabase\\.co"]'
          minimum-change-threshold: 50
          # a push to main *is* main, so it only compares vs production (the
          # last release) and the release before that
          base-refs: ${{ steps.base-refs.outputs.json }}
          # on push, comment on the open release PR so its report reflects the
          # merged code
          pr-number: ${{ steps.release-pr.outputs.number }}
          journey: ${{ matrix.journey }}
