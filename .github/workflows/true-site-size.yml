name: real site size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 25.x
          cache: pnpm
      - uses: jimhigson/true-site-size@main
        with:
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm build:game
          serve-dir: dist
          compression: gzip
          # temporarily comparing against the marks-only baseline branch so
          # this demo PR can show a delta (main has no performance marks yet);
          # remove base-ref once marks are merged to main
          base-ref: true-site-size-baseline
          scenarios: |
