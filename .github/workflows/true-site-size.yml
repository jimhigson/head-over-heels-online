name: true site size

on:
  pull_request:
    branches: [main]
  # also run on push to main so an open release PR's report is refreshed to
  # reflect just-merged code (a pull_request run doesn't re-fire when main moves)
  push:
    branches: [main]
  # measure past commits on main into the size history (see the backfill job)
  workflow_dispatch:
    inputs:
      backfill:
        description: 'commits to measure into the size history: comma-separated ranges ("v27.0.0..main"), counts of main''s latest commits ("30"), "releases:6" for the latest releases, or single refs'
        default: "30"

permissions:
  # contents: write lets pushes to main (and backfills) record into the
  # true-site-size-history branch
  contents: write
  pull-requests: write

concurrency:
  # a new push to a PR makes its running measurement stale, so it's cancelled.
  # But each push to main records its commit into the size history, and a
  # cancelled run would leave a gap - so main's runs get a group per commit and
  # never cancel each other. (Queueing in one group isn't enough: github keeps
  # only one pending run per group and cancels the rest.) Concurrent history
  # writes are safe - the action retries a rejected push
  group: true-site-size-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # a manual dispatch measures past commits into the true-site-size-history
  # branch that the size comment charts. Commits already recorded are skipped
  # and each is pushed as measured, so a long range can be split across
  # several dispatches, or rerun if it stops short of timeout-ms
  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: backfill ${{ inputs.backfill }}
    env:
      # must match the measure job's journey exactly - only commits measured
      # under the same config are charted together
      journey: |
        [
          { "startAgain": "game" },
          { "goto": "/?track=0" },
          { "row": "to menu", "mark": "menu-ready", "emoji": "📋" },
          { "click": "[data-menuitem_id=\"playGame\"]" },
          { "click": "[data-menuitem_id=\"originalGame\"]" },
          { "click": "[data-dialog-id=\"crowns\"]", "afterMark": "first-gameplay" },
          { "waitForGone": "[data-dialog-id=\"crowns\"]" },
          { "row": "to game", "mark": "first-gameplay", "emoji": "🎮", "chart": "cumulative" },
          { "keys": "M" },
          { "row": "open map", "mark": "open map", "emoji": "🗺️" },
          { "keys": "M" },
          { "keys": "Y" },
          { "row": "turn smoothing on", "mark": "smooth-ui-ready", "emoji": "✨" },
          { "startAgain": "editor" },
          { "goto": "/editor/" },
          { "row": "editor", "marks": ["editor-monaco-ready", "editor-map-ready"], "emoji": "🛠️" }
        ]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - uses: jimhigson/true-site-size@main
        with:
          history-branch: true-site-size-history
          backfill: ${{ inputs.backfill }}
          install-command: pnpm install --frozen-lockfile
          clean-command: pnpm clean:ci
          build-command: pnpm build
          serve-dir: dist
          compression: br
          compression-level: 11
          ignore-url-patterns: '["supabase\\.co"]'
          ignore-low-priority: "true"
          mark-timeout-ms: "20000"
          # 5h30 - inside the 6h job limit; the backfill stops cleanly before
          # starting a commit that would overrun, and a rerun continues it
          timeout-ms: "19800000"
          journey: ${{ env.journey }}

  measure:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: size
    env:
      # one journey covers both apps from a single `pnpm build` (game into
      # dist, editor into dist/editor): the game visit, then a startAgain
      # cold-restarts the browser so the editor visit is measured from an
      # empty cache with its own rows and total
      journey: |
        [
          { "startAgain": "game" },
          { "goto": "/?track=0" },
          { "row": "to menu", "mark": "menu-ready", "emoji": "📋" },
          { "click": "[data-menuitem_id=\"playGame\"]" },
          { "click": "[data-menuitem_id=\"originalGame\"]" },
          { "click": "[data-dialog-id=\"crowns\"]", "afterMark": "first-gameplay" },
          { "waitForGone": "[data-dialog-id=\"crowns\"]" },
          { "row": "to game", "mark": "first-gameplay", "emoji": "🎮", "chart": "cumulative" },
          { "keys": "M" },
          { "row": "open map", "mark": "open map", "emoji": "🗺️" },
          { "keys": "M" },
          { "keys": "Y" },
          { "row": "turn smoothing on", "mark": "smooth-ui-ready", "emoji": "✨" },
          { "startAgain": "editor" },
          { "goto": "/editor/" },
          { "row": "editor", "marks": ["editor-monaco-ready", "editor-map-ready"], "emoji": "🛠️" }
        ]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
      # GitHub's hosted ubuntu-latest runner ships with Google Chrome
      # preinstalled, so this step is a no-op in CI. It exists only so the
      # workflow can also be run locally with `act` whose runner images
      # don't contain a browser
      - name: Ensure Chrome is installed (for local `act` runs)
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1 \
            || command -v google-chrome-stable >/dev/null 2>&1 \
            || command -v chromium >/dev/null 2>&1 \
            || command -v chromium-browser >/dev/null 2>&1; then
            echo "Chrome/Chromium already present - nothing to install"
          else
            echo "No browser on PATH - installing Google Chrome for the size journey"
            deb="$(mktemp --suffix=.deb)"
            curl -fsSL -o "$deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y "$deb"
            rm -f "$deb"
            # `act` runs steps as root, and Chrome refuses to run as root with
            # its sandbox enabled ("Running as root without --no-sandbox is not
            # supported"). Point CHROME_PATH at a wrapper that adds --no-sandbox
            # so the journey can launch. This is only set in this act-only
            # branch, so CI keeps using sandboxed Chrome as the non-root runner.
            wrapper=/usr/local/bin/chrome-no-sandbox
            printf '#!/usr/bin/env bash\nexec /usr/bin/google-chrome-stable --no-sandbox "$@"\n' | sudo tee "$wrapper" >/dev/null
            sudo chmod +x "$wrapper"
            echo "CHROME_PATH=$wrapper" >> "$GITHUB_ENV"
          fi
      # on push to main, find the open release PR whose report to refresh
      - id: release-pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --base main --json number,headRefName \
                --jq 'map(select(.headRefName | startswith("release-please--")))[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      # act only: the sandbox checkout's origin points at an unreachable local
      # git proxy; the in-container base-ref fetch needs the public URL.
      # Tolerates there being no usable repository at all: running act from a
      # git worktree gives the container a `.git` file whose gitdir is outside
      # it, and no clone of it succeeds - the action then reports the head size
      # alone, which is still worth having
      - if: ${{ env.ACT }}
        run: |
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git remote set-url origin https://github.com/jimhigson/head-over-heels-online
          else
            echo "no usable git repository - base comparison will be skipped"
          fi
      # the latest release (what blockstack.ing serves) and the release before
      # it, for a third historical comparison point (production's own size
      # delta at the last release). `gh release list` needs a real token, so
      # under act this falls back to the newest `v*` tags on origin
      - id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${ACT:-}" ]; then
            tags=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' 2>/dev/null \
                  | head -2 | sed 's|.*refs/tags/||' | jq -R . | jq -sc . || echo '[]')
          else
            tags=$(gh release list --json tagName,isDraft,isPrerelease --limit 10 \
                  --jq '[.[] | select(.isDraft==false and .isPrerelease==false)] | .[0:2] | map(.tagName)')
          fi
          echo "latest=$(jq -r '.[0] // empty' <<<"$tags")" >> "$GITHUB_OUTPUT"
          echo "previous=$(jq -r '.[1] // empty' <<<"$tags")" >> "$GITHUB_OUTPUT"
      - id: base-refs
        env:
          IS_RELEASE_PLEASE_PR: ${{ startsWith(github.head_ref, 'release-please--') }}
          LATEST_RELEASE_TAG: ${{ steps.releases.outputs.latest }}
          PREV_RELEASE_TAG: ${{ steps.releases.outputs.previous }}
        run: |
          # local `act` runs can pass --env TSS_BASE_REFS="main" to compare
          # against fewer refs (each ref is a full build+measure); unset in CI
          if [ -n "${TSS_BASE_REFS:-}" ]; then
            json=$(printf '%s\n' $TSS_BASE_REFS | jq -R . | jq -sc .)
            echo "json=$json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          refs=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$IS_RELEASE_PLEASE_PR" != "true" ]; then
            refs+=("main")
          fi
          if [ -n "$LATEST_RELEASE_TAG" ]; then
            refs+=("$LATEST_RELEASE_TAG")
          fi
          if [ -n "$PREV_RELEASE_TAG" ]; then
            refs+=("$PREV_RELEASE_TAG")
          fi
          json=$(printf '%s\n' "${refs[@]}" | jq -R . | jq -sc .)
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - uses: jimhigson/true-site-size@main
        if: github.event_name == 'pull_request'
        with:
          history-branch: true-site-size-history
          # the since-last-release chart is capped at this many commits; 72
          # reaches back past v27.0.0 to show the whole run since it
          history-length: "72"
          install-command: pnpm install --frozen-lockfile
          clean-command: pnpm clean:ci
          build-command: pnpm build
          serve-dir: dist
          compression: br
          compression-level: 11
          ignore-url-patterns: '["supabase\\.co"]'
          # speculative preloads (fetched with priority "low") aren't needed to get ready
          ignore-low-priority: "true"
          minimum-change-threshold: 50
          mark-timeout-ms: "20000"
          # each ref now builds both apps in one go, so allow longer than the
          # action's 15-minute default before the whole-run watchdog fires
          timeout-ms: "1800000"
          # a normal PR compares vs main (its merge target), the last release
          # and the release before that. a release-please PR
          # only bumps the build number over main, so a vs-main comparison is
          # meaningless noise - it omits main and compares vs the two releases
          # alone.
          base-refs: ${{ steps.base-refs.outputs.json }}
          journey: ${{ env.journey }}
      # every push to main runs, recording main's sizes into the history; it
      # comments only when there's an open release PR to refresh
      - uses: jimhigson/true-site-size@main
        if: github.event_name == 'push'
        with:
          history-branch: true-site-size-history
          history-length: "72"
          install-command: pnpm install --frozen-lockfile
          clean-command: pnpm clean:ci
          build-command: pnpm build
          serve-dir: dist
          compression: br
          compression-level: 11
          ignore-url-patterns: '["supabase\\.co"]'
          # speculative preloads (fetched with priority "low") aren't needed to get ready
          ignore-low-priority: "true"
          minimum-change-threshold: 50
          mark-timeout-ms: "20000"
          # each ref now builds both apps in one go, so allow longer than the
          # action's 15-minute default before the whole-run watchdog fires
          timeout-ms: "1800000"
          # a push to main *is* main, so it only compares vs the last release
          # and the release before that
          base-refs: ${{ steps.base-refs.outputs.json }}
          # on push, comment on the open release PR so its report reflects the
          # merged code
          pr-number: ${{ steps.release-pr.outputs.number }}
          journey: ${{ env.journey }}
