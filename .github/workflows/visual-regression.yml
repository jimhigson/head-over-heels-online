name: Visual Regression

on:
  pull_request:
    branches: [main]

jobs:
  # since github has no way to require that all workflows that run must be successful other than marking them as required,
  # this breaks if the workflow is straight-up optional since gh will wait forever for it to complete. Instead, we make
  # this workflow always run, but exit quick if the paths that it governs haven't changed
  check-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      should-run: ${{ steps.filter.outputs.visual-regression-trigger-files }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: "shell"
          filters: |
            visual-regression-trigger-files:
              - 'src/**'
              - 'e2e/**'
              - 'gfx/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/visual-regression.yml'
              - '.github/actions/visual-test-setup/**'

  # job builds once, and then the built, cached asset of the game (not inc editor) is used for all playwright
  # jobs - meaning that each playwright runner does not have to do its own build
  build-game:
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Cache game build
        uses: actions/cache@v5
        id: game-build-cache
        with:
          path: dist/
          # hashing with hash-files is unreliable cross-platform (gives different results on unix/win) so use the
          # git sha instead. This would means a new build for every new commit, which could otherwise have been skipped,
          # but the build does only happen after check-changes has passed, so this shouldn't cause too many builds
          key: game-build-visual-regression-${{ github.sha }}
          # share caches with Windows even though building on Unix:
          enableCrossOsArchive: true

      - name: Install pnpm
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install
        if: steps.game-build-cache.outputs.cache-hit != 'true'

      - name: Build game
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        # diverge from the normal build by not minifying, in case of errors so that it is easier to see what went
        # wrong from the logs
        run: pnpm build:game --mode visual-regression

      # the cache above only saves this job from rebuilding; the build reaches the
      # test jobs as an artifact, which cannot be evicted out from under them
      - name: Upload game build
        uses: actions/upload-artifact@v7
        with:
          name: game-build-visual-regression
          path: dist/
          # only needed by this run's own test jobs
          retention-days: 1
          if-no-files-found: error

  visual-tests:
    needs: [check-changes, build-game]
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # matrix is more readable with one-line per entry:
        # prettier-ignore
        include:
          # ROOM SNAPSHOTS           
          # Ubuntu
          ## chrom(ium) based - these run quite fast on github so 2 runners each:
          - { os: ubuntu-24.04-arm, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 0, batch_count: 2, parallel_tests: 2 }
          - { os: ubuntu-24.04-arm, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 1, batch_count: 2, parallel_tests: 2 }

          ### mobile chrome on playwright is slower than desktop so 1 more runner:
          - { os: ubuntu-24.04-arm, suite: roomSnapshots.spec.ts, projectOption: --project mobile-chrome, batch_number: 0, batch_count: 3, parallel_tests: 2 }
          - { os: ubuntu-24.04-arm, suite: roomSnapshots.spec.ts, projectOption: --project mobile-chrome, batch_number: 1, batch_count: 3, parallel_tests: 2 }
          - { os: ubuntu-24.04-arm, suite: roomSnapshots.spec.ts, projectOption: --project mobile-chrome, batch_number: 2, batch_count: 3, parallel_tests: 2 }

          ## webkit/safari based - run on macOS runners so WebKit rendering (real
          ## Safari fonts, P3 colour) matches actual Safari and the macOS-captured
          ## baselines, rather than Playwright's Linux WebKit build:
          # (neglecting to run all to keep runner count down)
          - { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project webkit-desktop, batch_number: 0, batch_count: 3, parallel_tests: 2 }
          #- { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project webkit-desktop, batch_number: 1, batch_count: 3, parallel_tests: 2 }
          - { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project webkit-desktop, batch_number: 2, batch_count: 3, parallel_tests: 2 }

          ### and mobile safari (also WebKit → macOS):
          # (neglecting to run all to keep runner count down)
          #- { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project mobile-safari, batch_number: 0, batch_count: 5, parallel_tests: 2 }
          - { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project mobile-safari, batch_number: 1, batch_count: 5, parallel_tests: 2 }
          #- { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project mobile-safari, batch_number: 2, batch_count: 5, parallel_tests: 2 }
          - { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project mobile-safari, batch_number: 3, batch_count: 5, parallel_tests: 2 }
          #- { os: macos-latest, suite: roomSnapshots.spec.ts, projectOption: --project mobile-safari, batch_number: 4, batch_count: 5, parallel_tests: 2 }

          # Windows - chromium only (no webkit/safari, no mobile browsers)
          # windows runners are very low-spec so keep to one parallel test at a time
          # Win runners are slow so they get more batches to even it out
          # but not running every one since a representative sample of rooms
          # is sufficient for cross-OS differences, and this takes up too many agents on ci/cd:
          - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 0, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 1, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 2, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 3, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 4, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 5, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 6, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 7, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 8, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 9, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 10, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 11, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          # - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 12, batch_count: 14, parallel_tests: 1, no_toppy: "1" }
          - { os: windows-latest, suite: roomSnapshots.spec.ts, projectOption: --project chromium-desktop, batch_number: 13, batch_count: 14, parallel_tests: 1, no_toppy: "1" }

          # CAMERA ROTATION (identity + sweep) -
          # only desktop-chromium (Linux) and one mobile-webkit (macOS).
          # excludes the smooth-sprites tests below (their own job) so they
          # don't also run here as part of the whole spec file:
          - { os: ubuntu-24.04-arm, suite: cameraRotation, projectOption: --project chromium-desktop, grepInvert: "smooth sprites" }
          - { os: macos-latest, suite: cameraRotation, projectOption: --project mobile-safari, grepInvert: "smooth sprites" }

          # SMOOTH SPRITES (live toggle + reload-with-setting-persisted) - bespoke
          # boot/reload steps unlike the angle-sweep scenarios, so filtered by test
          # title rather than folded into the scenario loop above:
          - { os: ubuntu-24.04-arm, suite: cameraRotation, projectOption: --project chromium-desktop, grep: "smooth sprites" }
          - { os: macos-latest, suite: cameraRotation, projectOption: --project mobile-safari, grep: "smooth sprites" }

          # LUT SNAPSHOTS - single batch per os/browser combo
          # chromium/mobile-chrome on Linux, webkit/mobile-safari on macOS:
          - { os: ubuntu-24.04-arm, suite: lutSnapshot, projectOption: "--project chromium-desktop --project mobile-chrome" }
          - { os: macos-latest, suite: lutSnapshot, projectOption: "--project webkit-desktop --project mobile-safari" }
          - { os: windows-latest, suite: lutSnapshot, projectOption: --project chromium-desktop }

          # MENU SNAPSHOTS - one agent per spec file per OS
          # chromium/mobile-chrome on Linux, webkit/mobile-safari on macOS (real Safari font rendering):
          - { os: ubuntu-24.04-arm, suite: "menuSnapshotsDialogs errorDialogSnapshot", projectOption: "--project chromium-desktop --project mobile-chrome" }
          - { os: macos-latest, suite: "menuSnapshotsDialogs errorDialogSnapshot", projectOption: "--project webkit-desktop --project mobile-safari" }
          - { os: ubuntu-24.04-arm, suite: menuSnapshotsInGame, projectOption: "--project chromium-desktop --project mobile-chrome" }
          - { os: macos-latest, suite: menuSnapshotsInGame, projectOption: "--project webkit-desktop --project mobile-safari" }
          - { os: ubuntu-24.04-arm, suite: menuSnapshotsMainMenu, projectOption: "--project chromium-desktop --project mobile-chrome" }
          - { os: macos-latest, suite: menuSnapshotsMainMenu, projectOption: "--project webkit-desktop --project mobile-safari" }
          # skip uncolourised and toppy on windows to speed it up since it is the slowest:
          - { os: windows-latest, suite: menuSnapshotsDialogs, projectOption: --project chromium-desktop, no_uncolourised: "1", no_toppy: "1" }
          - { os: windows-latest, suite: menuSnapshotsInGame, projectOption: --project chromium-desktop, no_uncolourised: "1", no_toppy: "1" }
          - { os: windows-latest, suite: menuSnapshotsMainMenu, projectOption: --project chromium-desktop, no_uncolourised: "1", no_toppy: "1" }

          # SETTINGS REFLECT IN GAME - chromium/mobile-chrome on Linux, webkit/mobile-safari on macOS
          - { os: ubuntu-24.04-arm, suite: settingsReflectInGame, projectOption: "--project chromium-desktop --project mobile-chrome" }
          - { os: macos-latest, suite: settingsReflectInGame, projectOption: "--project webkit-desktop --project mobile-safari" }

          # PORTRAIT - room + menu snapshots on a single agent (suite filter not needed, project testMatch restricts specs)
          # mobile-safari-portrait is WebKit → macOS
          - { os: macos-latest, suite: "", projectOption: --project mobile-safari-portrait }

          # SPRITES - single batch, chromium-desktop only on Linux
          - { os: ubuntu-24.04-arm, suite: spritesPage, projectOption: --project chromium-desktop }
    # name is super-compressed to fit on the github UI with enough info to identify what's being run
    name: >-
      ${{
        matrix.suite == 'lutSnapshot' && format('Lut {0}', contains(matrix.os, 'windows') && 'Windows' || contains(matrix.os, 'macos') && 'macOS' || 'Linux')
        || startsWith(matrix.suite, 'menuSnapshotsDialogs') && format('MnuDlg {0}', contains(matrix.os, 'windows') && 'Win' || contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || matrix.suite == 'menuSnapshotsInGame' && format('MnuGame {0}', contains(matrix.os, 'windows') && 'Win' || contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || matrix.suite == 'menuSnapshotsMainMenu' && format('MnuMain {0}', contains(matrix.os, 'windows') && 'Win' || contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || matrix.suite == 'settingsReflectInGame' && 'Settings'
        || matrix.suite == 'spritesPage' && 'Sprites'
        || matrix.grep == 'smooth sprites' && format('Smooth {0}', contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || startsWith(matrix.suite, 'cameraRotation') && format('CamRot {0}', contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || startsWith(matrix.suite, 'roomSnapshotsRotated') && format('Rotated {0}', contains(matrix.os, 'macos') && 'Mac' || 'Lnx')
        || matrix.suite == '' && format('All:{0}',
            contains(matrix.projectOption, 'mobile-safari-portrait') && 'mobile-safari-portrait'
              || matrix.projectOption)
        || format('Room:{0}.{1}{2} {3}/{4}',
            contains(matrix.os, 'windows') && 'Win' || contains(matrix.os, 'macos') && 'Mac' || 'Lnx',
            contains(matrix.projectOption, 'chrom') && 'Chrm'
              || contains(matrix.projectOption, 'webkit') && 'Wkit'
              || contains(matrix.projectOption, 'safari') && 'Wkit'
              || matrix.projectOption,
            contains(matrix.projectOption, 'mobile') && 'Mob' || 'Dsktp',
            matrix.batch_number,
            matrix.batch_count)
      }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up visual test environment
        uses: ./.github/actions/visual-test-setup
        with:
          project-option: ${{ matrix.projectOption }}

      - name: Run Playwright tests
        env:
          BATCH_COUNT: ${{ matrix.batch_count }}
          BATCH_NUMBER: ${{ matrix.batch_number }}
          PARALLEL_TESTS: ${{ matrix.parallel_tests }}
          # on Windows CI runners, Chrome complains unless this is turned on to enable software OpenGL rendering:
          PLAYWRIGHT_CHROMIUM_ARGS: ${{ runner.os == 'Windows' && '--enable-unsafe-swiftshader' || '' }}
          NO_UNCOLOURISED: ${{ matrix.no_uncolourised }}
          NO_TOPPY: ${{ matrix.no_toppy }}
        run: >-
          pnpm playwright test ${{ matrix.suite }} ${{ matrix.projectOption }}
          ${{ matrix.grep && format('-g "{0}"', matrix.grep) || '' }}
          ${{ matrix.grepInvert && format('--grep-invert "{0}"', matrix.grepInvert) || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.suite || 'all' }}-${{ matrix.batch_number || 'single' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # finally, a job to pass if either the VR tests didn't run, or they ran and were successful:
  visual-regression-gate:
    name: "Visual Regression Gate"
    runs-on: ubuntu-24.04-arm
    needs: [check-changes, visual-tests]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.check-changes.outputs.should-run }}" != "true" ]]; then
            echo "Visual regression skipped - not required"
            exit 0
          elif [[ "${{ needs.visual-tests.result }}" == "success" ]]; then
            echo "Visual regression tests passed"
            exit 0
          else
            echo "Visual regression tests failed"
            exit 1
          fi
