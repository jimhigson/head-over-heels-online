name: Apply DB migrations

# Applies supabase/migrations to the hosted database with `supabase db push`, on
# the SAME trigger as the production deploy (deploy-to-r2.yml): a published
# release. Schema ships in lockstep with prod. A manual run applies the latest
# release's migrations, never unreleased ones.
#
# Single shared db: blockstack.dev (from main) uses the same database, so
# between a change merging to main and the next prod release it runs against the
# not-yet-applied schema. Keep migrations backwards-compatible (see DEVELOPING.md).
#
# PREREQUISITE (one-off cutover): the baseline migration must be registered as
# already-applied on the remote, or the first `db push` tries to recreate the
# existing schema and fails:
#   supabase migration repair --status applied 20260624072125

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-24.04-arm
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: pkswdnpftrundnewgnya
    steps:
      # pick the release tag to check out, so only released migrations are
      # applied: the tag of the release that triggered this run, or, on a
      # manual run, the latest published release's tag
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=${RELEASE_TAG:-$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
