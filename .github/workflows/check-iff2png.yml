name: Check IFF to PNG conversion is up-to-date

on:
  pull_request:
    branches: ["main"]
    paths:
      - "gfx/*.iff"
      - "gfx/*.webp"
      - "src/_generated/palette/*.json"
      - "scripts/iff2png.sh"
  workflow_dispatch:

jobs:
  check-iff2png:
    runs-on: ubuntu-latest
    # run inside a Debian 13 (trixie) image, whose apt ships ImageMagick 7 (the
    # `magick` command iff2png uses); ubuntu-latest's apt is still ImageMagick 6,
    # which only has the legacy `convert`/`compare` commands. The node:*-trixie
    # variant (not bare debian:trixie) is used so the JS actions below have a
    # node interpreter to run on.
    container: node:26-trixie

    defaults:
      run:
        shell: bash

    steps:
      - name: Install system tools (ImageMagick 7, ffmpeg, etc.)
        run: |
          apt-get update
          apt-get install -y imagemagick pngquant ffmpeg jq xz-utils webp
          magick --version | head -1
      - uses: actions/checkout@v6
      # the container runs git as root but the checkout is owned by another uid,
      # so git rejects it as "dubious ownership" and both husky (during install)
      # and revert_noop_images (in iff2png) fail with "not inside a git
      # repository". checkout only sets safe.directory under a temporary HOME, so
      # set it in the run-step HOME here.
      - name: Trust the checked-out workspace (container git runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install
      - name: Save original image files before regeneration
        run: |
          IMAGE_FILES=(gfx/sprites.webp gfx/sprites.borders.png)
          for img in "${IMAGE_FILES[@]}"; do
            cp "$img" "/tmp/$(basename $img).original"
          done
      - run: pnpm iff2png
      - name: Check image processing scripts are a no-op
        run: |
          NON_IMAGE_FILES="
            src/_generated/palette/spritesheetPalette.json
            src/_generated/palette/spritesheetPaletteDim.json
            src/_generated/palette/spritesheetToppyPalette.json
          "
          git diff --exit-code -- $NON_IMAGE_FILES || (echo "Files were modified by 'pnpm iff2png'. Please run 'pnpm iff2png' locally and commit the changes." && exit 1)

          # For image files, compare pixels only (ignore metadata)
          IMAGE_FILES=(gfx/sprites.webp gfx/sprites.borders.png)
          for img in "${IMAGE_FILES[@]}"; do
            diff_pixels=$(magick compare -metric AE "$img" "/tmp/$(basename $img).original" null: 2>&1 || true)
            # magick compare outputs format "N (normalized)" where N is pixel count
            # Extract just the first number (pixel count) from output like "0 (0)"
            diff_count=$(echo "$diff_pixels" | awk '{print $1}')
            if [ "$diff_count" != "0" ]; then
              echo "Image file $img has pixel differences: $diff_pixels pixels differ"
              echo "Please run 'pnpm iff2png' locally and commit the changes."
              exit 1
            fi
          done
