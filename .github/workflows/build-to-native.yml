name: Build to Native

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production]
  release:
    types: [published]

jobs:
  tauri-build:
    name: TauriBuild - ${{ matrix.platform }} ${{ matrix.toolchain && format('({0})', matrix.toolchain) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri-build-args: "--target universal-apple-darwin"
            # support both arm and intel macs with a universal binary:
            rust-target: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-24.04-arm
            tauri-build-args: ""
          - platform: ubuntu-latest
            tauri-build-args: ""
          - platform: windows-latest
            # msvc is MS Visual C++ toolchain supported officially
            # by tauri, but building with it causes Windows Defender to have issues
            toolchain: "msvc"
            tauri-build-args: ""
          - platform: windows-latest
            # mingw is the gnu equivalent - not officially supported by tauri
            # but may help with Windows Defender AV
            toolchain: "mingw"
            rust-target: x86_64-pc-windows-gnu
            rust-toolchain: stable-x86_64-pc-windows-gnu
            tauri-build-args: "--target x86_64-pc-windows-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-toolchain || 'stable' }}
          targets: ${{ matrix.rust-target }}

      # macOS runner images sometimes ship a preinstalled `rustup-init` binary
      # that places shims for `cargo`, `rustc`, etc. on a system PATH entry.
      # These shims are actually `rustup-init` and fail with:
      #   "unexpected argument 'metadata' found — Usage: rustup-init[EXE]"
      # when Tauri calls `cargo metadata`.
      #
      # The dtolnay/rust-toolchain action installs the real cargo into
      # ~/.cargo/bin, but the preinstalled shims can shadow it if they appear
      # earlier on PATH. This step puts ~/.cargo/bin first to ensure the real
      # binaries win.
      #
      # References:
      #   https://github.com/actions/runner/issues/3257
      - name: Ensure real cargo is on PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-24.04-arm'
        # xdg-utils provides xdg-open; needed for opening external links in default browser
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Setup MinGW (Windows GNU only)
        if: matrix.toolchain == 'mingw'
        uses: egor-tensin/setup-mingw@v2
        with:
          # Disable the static pthread workaround (static: 0)
          # The workaround removes libpthread.dll.a and libwinpthread.dll.a import libraries
          # to force static linking of pthread, avoiding runtime DLL dependencies.
          # However, MinGW 15.2.0+ no longer ships libpthread.dll.a at the expected location,
          # causing the removal step to fail. Since Tauri handles its own static linking
          # configuration, we don't need this workaround.
          static: 0

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri-build-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tauri's .output_ok() swallows bundle_dmg.sh's stdout/stderr, so on
      # failure we re-run it with bash -x to see every command and its output.
      - name: Re-run bundle_dmg.sh with tracing (debug)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          script=$(find src-tauri/target -name "bundle_dmg.sh" -print -quit)
          if [[ -z "$script" ]]; then
            echo "bundle_dmg.sh not found — build failed before DMG stage"
            exit 0
          fi
          echo "::group::bundle_dmg.sh trace"
          echo "Re-running: $script"
          # extract the args Tauri would have passed by reading the generated script's sibling files
          dmg_dir=$(dirname "$script")
          app_dir=$(dirname "$dmg_dir")/macos
          dmg_name=$(ls "$dmg_dir"/*.dmg 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          app_name=$(ls "$app_dir"/*.app 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          echo "dmg_name=$dmg_name app_name=$app_name"
          # run with tracing — don't fail the job again, we just want the output
          cd "$app_dir"
          bash -x "$script" --skip-jenkins "$dmg_name" "$app_name" 2>&1 || true
          echo "::endgroup::"

      - name: List build artefacts
        shell: bash
        run: find src-tauri/target -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" | sort

      - name: Upload artifacts (non-release)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain && format('{0}-{1}', matrix.platform, matrix.toolchain) || matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
