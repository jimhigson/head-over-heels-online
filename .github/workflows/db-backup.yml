name: Back up DB

# nightly full dump of the hosted supabase db (roles, schema, and data for the
# public + auth schemas) as a single brotli-compressed tarball per run, named by
# timestamp, flat in the private hoh-db-backups R2 bucket. Nothing is ever deleted.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: pkswdnpftrundnewgnya
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_DB_BACKUPS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DB_BACKUPS_WRITE_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: sudo apt-get update -q && sudo apt-get install -y -q brotli
      - name: Dump
        run: |
          echo "BACKUP_FILE=$(date -u +%Y-%m-%dT%H%M%SZ).tar.br" >> "$GITHUB_ENV"
          mkdir dump
          supabase db dump --linked --role-only -f dump/roles.sql
          supabase db dump --linked -f dump/schema.sql
          supabase db dump --linked --data-only --use-copy -s public,auth -f dump/data.sql
      - name: Compress
        run: |
          tar -C dump -cf - . | brotli -q 11 -w 24 -o "$BACKUP_FILE"
          ls -l dump "$BACKUP_FILE"
      - name: Upload to R2
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://hoh-db-backups/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT"
