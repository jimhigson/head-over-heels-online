name: Check- tests, lint, formatting

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install
      - name: Run checks
        run: |
          for script in $(jq -r '.scripts | keys[] | select(startswith("check:"))' package.json); do
            echo "::group::$script"
            pnpm run "$script" || { echo "::endgroup::"; echo "::error::$script failed"; exit 1; }
            echo "::endgroup::"
          done
