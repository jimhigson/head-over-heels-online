name: E2E

on:
  pull_request:
    branches: [main]

jobs:
  # mirror the visual-regression workflow's pattern: always run, but exit
  # quickly when the paths governed by this workflow have not changed.
  check-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      should-run: ${{ steps.filter.outputs.e2e-trigger-files }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: "shell"
          filters: |
            e2e-trigger-files:
              - 'src/**'
              - 'e2e/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e.yml'

  build-game:
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Cache game build
        uses: actions/cache@v5
        id: game-build-cache
        with:
          path: dist/
          # share with the visual-regression workflow's build cache - same
          # contents, same key shape (sha-pinned).
          key: game-build-visual-regression-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Install pnpm
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install
        if: steps.game-build-cache.outputs.cache-hit != 'true'

      - name: Build game
        if: steps.game-build-cache.outputs.cache-hit != 'true'
        run: pnpm build:game --mode visual-regression

      # the cache above only saves this job from rebuilding; the build reaches the
      # test jobs as an artifact, which cannot be evicted out from under them
      - name: Upload game build
        uses: actions/upload-artifact@v7
        with:
          name: game-build-e2e
          path: dist/
          # only needed by this run's own test jobs
          retention-days: 1
          if-no-files-found: error

  e2e-tests:
    needs: [check-changes, build-game]
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # every spec not in the visual-regression matrix appears in exactly
          # one group here (saveCompatCapture excepted - a fixture-capture tool,
          # not a test), so nothing can silently drift with no CI running it.
          # Grouped by domain, balanced by measured runtime; lifeAndDeath is a
          # group alone because it is the slowest single file
          - suite: lives
            pattern: "lifeAndDeath"
          - suite: saves
            pattern: "saveCompatLoad savesAndGameOver"
          - suite: gameLifecycle
            pattern: "persistOnReload reincarnationStack gameComplete quitGameFlow offlineCampaignCache"
          - suite: menusAndRendering
            pattern: "crownsDialogs upscaleResponds onScreenControls mainMenuClosability gameRendersAfterRendererReset scrollAndKeyRebind playtestNoSave doughnuttedMonsters errorDialogSnapshot"
    name: E2E ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install

      # an artifact, not a cache: the tests cannot run at all without the build, and
      # a cache is allowed to miss - entries are evicted whenever the repo is over
      # its size limit, which silently leaves dist/ absent and fails every job here
      # with "The directory dist does not exist"
      - name: Download game build
        uses: actions/download-artifact@v8
        with:
          name: game-build-e2e
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm playwright install chromium

      - name: Run Playwright tests
        run: pnpm playwright test ${{ matrix.pattern }} --project chromium-desktop --project mobile-chrome

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-e2e-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-gate:
    name: "E2E Gate"
    runs-on: ubuntu-24.04-arm
    needs: [check-changes, e2e-tests]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.check-changes.outputs.should-run }}" != "true" ]]; then
            echo "E2E skipped - not required"
            exit 0
          elif [[ "${{ needs.e2e-tests.result }}" == "success" ]]; then
            echo "E2E tests passed"
            exit 0
          else
            echo "E2E tests failed"
            exit 1
          fi
