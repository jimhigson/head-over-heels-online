name: Visual test setup
description: >-
  Shared setup for Playwright visual-snapshot jobs: install dependencies,
  download the game build produced by this run's build-game job, and install the
  Playwright browsers implied by the given project flags. Assumes the repository
  is already checked out.

inputs:
  project-option:
    description: >-
      The Playwright --project flag(s) for this job, eg
      "--project chromium-desktop --project mobile-chrome". Determines which
      browsers are installed and whether Linux system dependencies are needed.
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install

    # an artifact, not a cache: the tests cannot run at all without the build, and
    # a cache is allowed to miss - entries are evicted whenever the repo is over
    # its size limit, which silently leaves dist/ absent and fails every job here
    # with "The directory dist does not exist". Artifacts are held for the run
    # regardless of what else the repo is storing
    - name: Download game build
      uses: actions/download-artifact@v8
      with:
        name: game-build-visual-regression
        path: dist/

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install Playwright system dependencies
      if: (contains(inputs.project-option, 'webkit') || contains(inputs.project-option, 'safari') || contains(inputs.project-option, 'firefox')) && runner.os == 'Linux'
      shell: bash
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        sudo apt-get update
        # Retry loop - ports.ubuntu.com load balances across mirrors that can be out of sync
        for attempt in 1 2 3; do
          echo "=== Attempt $attempt ==="
          if pnpm playwright install-deps; then
            break
          fi
          echo "=== Failed, retrying in 10s ==="
          sleep 10
        done

    - name: Install Playwright browsers
      shell: bash
      run: |
        # Install all browsers mentioned in the --project flags
        # Always run this - playwright install is smart enough to skip if already installed
        if [[ "${{ inputs.project-option }}" == *"chromium"* ]] || [[ "${{ inputs.project-option }}" == *"chrome"* ]]; then
          pnpm playwright install chromium
        fi
        if [[ "${{ inputs.project-option }}" == *"firefox"* ]]; then
          pnpm playwright install firefox
        fi
        if [[ "${{ inputs.project-option }}" == *"webkit"* ]] || [[ "${{ inputs.project-option }}" == *"safari"* ]]; then
          pnpm playwright install webkit
        fi

    # headless chromium on linux picks its hinting/antialiasing by querying
    # fontconfig at launch, and lands in one of two discrete rendering modes
    # depending on what it gets back (see the comment on
    # chromiumFontRenderingLaunchOptions in playwright.config.ts). A snapshot
    # that differs by a whole pixel of text position is that query having
    # answered differently on this runner, so record what it answers - without
    # it the only evidence is the diff image, long after the runner is gone
    - name: Report fontconfig state (diagnostic for text-position snapshot diffs)
      if: runner.os == 'Linux'
      shell: bash
      # never fail the job for a diagnostic
      continue-on-error: true
      run: |
        # whether this runner reused a warm browser cache or unpacked a fresh
        # one is the only environmental asymmetry we have ever measured
        # between a runner that reproduced the baselines and one that did not
        echo "playwright browser cache hit: ${{ steps.playwright-cache.outputs.cache-hit || 'false' }}"
        echo "fonts visible to fontconfig: $(fc-list | wc -l)"
        echo "fontconfig cache dir: $(ls ~/.cache/fontconfig 2>/dev/null | wc -l) file(s)"
        # the properties chromium reads; the generic family is what decides the
        # defaults, since the game's own face is a webfont fontconfig never sees
        for family in sans-serif monospace; do
          echo "--- fc-match $family"
          fc-match -v "$family" 2>/dev/null |
            grep -E "^\s+(family|file|hintstyle|hinting|antialias|rgba|lcdfilter):" || true
        done
        # prove which binary actually launches, and that it is the pinned build
        chromium="$(pnpm exec playwright cbr --help >/dev/null 2>&1; find ~/.cache/ms-playwright -name 'chrome' -type f 2>/dev/null | head -1)"
        echo "chromium binary: ${chromium:-not found}"
        [ -n "$chromium" ] && "$chromium" --version 2>/dev/null || true
        echo "cpu: $(nproc) x $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | xargs || uname -m)"
