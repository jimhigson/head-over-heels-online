<meta charset="utf-8" />
<title>guided review</title>
<style>
  @font-face {
    font-family: "BlockStack";
    src: url("data:font/woff2;base64,FONT_B64") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  /* tokens taken from the game's own palette:
     src/_generated/palette/spritesheetPalette.json */
  :root {
    --paper: #f6f2f0;
    --card: #ffffff;
    --ink: #17201d;
    --ink-soft: #4c5a55;
    --ink-faint: #7c6e6c;
    --rule: #ddd4cf;
    --accent: #1366d0;
    --accent-soft: #e2edfb;

    --new: #1f6b52;
    --new-bg: #e0f1ea;
    --mod: #6e6400;
    --mod-bg: #f3eec9;
    --del: #864e39;
    --del-bg: #f6e3db;

    --add-edge: #2ea17c;
    --add-bg: rgb(46 161 124 / 0.1);
    --rm-edge: #e55f44;
    --rm-bg: rgb(134 78 57 / 0.1);
    --hunk: #6e6400;
    --hunk-bg: rgb(173 158 0 / 0.1);

    --shadow: 0 1px 2px rgb(23 32 29 / 0.05), 0 10px 26px rgb(23 32 29 / 0.05);

    --display: "BlockStack", ui-monospace, monospace;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #000000;
      --card: #31413b;
      --ink: #ffffff;
      --ink-soft: #c0afa9;
      --ink-faint: #9a8d8a;
      --rule: #47584f;
      --accent: #6cb5ff;
      --accent-soft: #16303f;

      --new: #3fdb8b;
      --new-bg: #133227;
      --mod: #f3eba9;
      --mod-bg: #3a3418;
      --del: #e55f44;
      --del-bg: #3a2119;

      --add-edge: #3fdb8b;
      --add-bg: rgb(63 219 139 / 0.13);
      --rm-edge: #e55f44;
      --rm-bg: rgb(229 95 68 / 0.14);
      --hunk: #f3eba9;
      --hunk-bg: rgb(173 158 0 / 0.16);

      --shadow: none;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --paper: #000000;
    --card: #31413b;
    --ink: #ffffff;
    --ink-soft: #c0afa9;
    --ink-faint: #9a8d8a;
    --rule: #47584f;
    --accent: #6cb5ff;
    --accent-soft: #16303f;

    --new: #3fdb8b;
    --new-bg: #133227;
    --mod: #f3eba9;
    --mod-bg: #3a3418;
    --del: #e55f44;
    --del-bg: #3a2119;

    --add-edge: #3fdb8b;
    --add-bg: rgb(63 219 139 / 0.13);
    --rm-edge: #e55f44;
    --rm-bg: rgb(229 95 68 / 0.14);
    --hunk: #f3eba9;
    --hunk-bg: rgb(173 158 0 / 0.16);

    --shadow: none;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --paper: #f6f2f0;
    --card: #ffffff;
    --ink: #17201d;
    --ink-soft: #4c5a55;
    --ink-faint: #7c6e6c;
    --rule: #ddd4cf;
    --accent: #1366d0;
    --accent-soft: #e2edfb;

    --new: #1f6b52;
    --new-bg: #e0f1ea;
    --mod: #6e6400;
    --mod-bg: #f3eec9;
    --del: #864e39;
    --del-bg: #f6e3db;

    --add-edge: #2ea17c;
    --add-bg: rgb(46 161 124 / 0.1);
    --rm-edge: #e55f44;
    --rm-bg: rgb(134 78 57 / 0.1);
    --hunk: #6e6400;
    --hunk-bg: rgb(173 158 0 / 0.1);

    --shadow: 0 1px 2px rgb(23 32 29 / 0.05), 0 10px 26px rgb(23 32 29 / 0.05);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  /* .row-body and the group bodies are flex/grid containers, whose display
     would otherwise win over the hidden attribute */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .layout { display: flex; align-items: flex-start; }

  .shell {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 64rem;
    margin: 0 auto;
    /* the trailing space is scroll range, below the footer: without it the last
       files can never reach the top of the viewport, and a jump from the
       contents to one of them barely moves the page */
    padding: 0 1.25rem max(5rem, 45vh);
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }

  .top-inner {
    margin: 0 auto;
    padding: 0.7rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem 1rem;
    flex-wrap: wrap;
  }

  .top-title {
    font-family: var(--display);
    font-size: 16px;
    letter-spacing: 0.02em;
    margin: 0;
    flex: 1 1 13rem;
    line-height: 1.4;
  }

  .meter {
    flex: 1 1 11rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    min-width: 11rem;
  }

  .track {
    flex: 1;
    height: 8px;
    background: var(--rule);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    background: var(--accent);
    transition: width 160ms ease-out;
  }

  .count {
    font-family: var(--display);
    font-size: 16px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .controls { display: flex; gap: 0.4rem; flex: none; flex-wrap: wrap; }

  button.control {
    font-family: var(--body);
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 0.3rem 0.55rem;
    cursor: pointer;
  }

  button.control:hover { border-color: var(--accent); color: var(--accent); }
  button.control:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.control[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  /* ---- contents sidebar --------------------------------------------------
     the whole reading order at a glance, ticked in step with the main pane */

  .sidebar {
    position: sticky;
    top: var(--header-height, 3.2rem);
    flex: 0 0 17rem;
    align-self: flex-start;
    max-height: calc(100vh - var(--header-height, 3.2rem));
    overflow-y: auto;
    overscroll-behavior: contain;
    border-right: 1px solid var(--rule);
    padding: 0.9rem 0.5rem 4rem 0.9rem;
  }

  .sidebar-title {
    font-family: var(--display);
    font-size: 16px;
    color: var(--ink-faint);
    margin: 0 0 0.6rem;
  }

  ol.tree, ul.tree-files { list-style: none; margin: 0; padding: 0; }

  .tree { font-size: 0.84rem; }
  .tree-group + .tree-group { margin-top: 0.55rem; }

  .tree-group-head {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.25rem;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 1;
  }

  .tree-step {
    font-family: var(--display);
    font-size: 16px;
    color: var(--accent);
    line-height: 1;
    flex: none;
  }

  button.tree-group-title {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-weight: 650;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  button.tree-group-title:hover { color: var(--accent); }

  .tree-count {
    flex: none;
    font-size: 0.7rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  ul.tree-files {
    margin: 0.15rem 0 0 0.45rem;
    padding-left: 0.5rem;
    border-left: 1px solid var(--rule);
  }

  .tree-file {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.1rem 0.25rem;
    border-left: 2px solid transparent;
  }

  .tree-file.is-active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  button.tree-file-link {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }

  button.tree-file-link:hover .tree-base { color: var(--accent); }
  button.tree-file-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tree-base {
    font-family: var(--mono);
    font-size: 0.76rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* the name is what the eye lands on, so it gives up its width last */
    flex: 0 1 auto;
  }

  .tree-dir {
    font-size: 0.68rem;
    color: var(--ink-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 100 auto;
    min-width: 0;
    /* ellipsis at the *start*: the directory nearest the file is the half
       worth keeping */
    direction: rtl;
    text-align: left;
  }

  /* ...but the path itself is ltr, or bidi moves its leading "." to the end */
  .tree-dir > span { direction: ltr; unicode-bidi: embed; }

  .tree-file.is-ticked { opacity: 0.5; }
  .tree-file.is-ticked .tree-base { text-decoration: line-through; }

  .note-count {
    flex: none;
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0 0.3rem;
    line-height: 1.4;
  }

  input.tick {
    width: 0.95rem;
    height: 0.95rem;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }

  input.tick.small { width: 0.8rem; height: 0.8rem; }

  .intro {
    padding: 3rem 0 2.25rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .eyebrow {
    font-family: var(--display);
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin: 0;
  }

  h1 {
    font-family: var(--display);
    font-size: 32px;
    line-height: 1.35;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  .lede {
    margin: 0;
    max-width: 62ch;
    color: var(--ink-soft);
    font-size: 1.02rem;
  }

  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.5rem;
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .facts code, .lede code, .note code, .blurb code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--accent-soft);
    color: var(--ink);
    padding: 0.05em 0.32em;
  }

  main { display: flex; flex-direction: column; gap: 0.9rem; padding-top: 2rem; }

  section.group {
    background: var(--card);
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
  }

  .group-head {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 1rem 1.1rem;
    cursor: pointer;
    /* the group's heading stays put while its files scroll under it, so it is
       always clear which part of the reading order you are in */
    position: sticky;
    top: var(--header-height, 3.2rem);
    z-index: 5;
    background: var(--card);
    border-bottom: 1px solid transparent;
  }

  section.group.is-open > .group-head { border-bottom-color: var(--rule); }

  .step {
    font-family: var(--display);
    font-size: 16px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.28rem 0.5rem 0.18rem;
    line-height: 1;
    flex: none;
  }

  .group-title {
    font-weight: 620;
    font-size: 1.06rem;
    letter-spacing: -0.005em;
    flex: 1;
  }

  .group-count {
    font-size: 0.8rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    flex: none;
  }

  button.caret {
    font-family: var(--body);
    font-size: 0.7rem;
    color: var(--ink-faint);
    background: none;
    border: 0;
    padding: 0.1rem 0.25rem;
    cursor: pointer;
    flex: none;
  }

  button.caret:hover { color: var(--accent); }
  button.caret:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .group-body { padding: 0 1.1rem 0.5rem; }

  .blurb {
    margin: 0 0 0.9rem;
    padding-left: calc(16px + 1.85rem);
    max-width: 68ch;
    color: var(--ink-soft);
    font-size: 0.94rem;
  }

  .rows { display: flex; flex-direction: column; }

  .row {
    border-top: 1px solid var(--rule);
    /* scrolled to from the sidebar: clear the page header and the group's own
       sticky heading */
    scroll-margin-top: calc(var(--header-height, 3.2rem) + 3.6rem);
  }

  .row-head {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.6rem 0;
    min-width: 0;
    cursor: pointer;
  }

  .row.is-ticked .row-head { opacity: 0.45; }
  .row-head:hover .caret { color: var(--accent); }

  .row-body {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0 0 0.85rem 1.6rem;
  }

  .chip {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.16rem 0.4rem;
    flex: none;
  }

  .chip-A { color: var(--new); background: var(--new-bg); }
  .chip-M { color: var(--mod); background: var(--mod-bg); }
  .chip-D { color: var(--del); background: var(--del-bg); }
  .chip-R { color: var(--accent); background: var(--accent-soft); }

  button.path {
    font-family: var(--mono);
    font-size: 0.83rem;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    cursor: copy;
    text-align: left;
    word-break: break-all;
    border-bottom: 1px dashed var(--rule);
    min-width: 0;
  }

  a.github {
    font-size: 0.72rem;
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    flex: none;
  }

  a.github:hover { color: var(--accent); border-bottom-color: var(--accent); }
  a.github:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.path:hover { color: var(--accent); border-bottom-color: var(--accent); }
  button.path:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.path.copied { color: var(--new); border-bottom-color: var(--new); }

  .row-stat {
    margin-left: auto;
    flex: none;
    font-size: 0.74rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .note {
    margin: 0;
    max-width: 68ch;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }

  .diff { margin-top: 0.35rem; }

  button.diff-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--body);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid transparent;
    padding: 0.28rem 0.7rem;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  button.diff-toggle::before { content: "▸"; font-size: 0.7rem; font-weight: 400; }
  button.diff-toggle[aria-expanded="true"]::before { content: "▾"; }
  button.diff-toggle:hover { border-color: var(--accent); }
  button.diff-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stat-add { color: var(--add-edge); font-weight: 600; }
  .stat-rm { color: var(--rm-edge); font-weight: 600; }

  .diff-body {
    overflow-x: auto;
    border: 1px solid var(--rule);
    border-left: 0;
    background: color-mix(in srgb, var(--paper) 55%, var(--card));
    margin-top: 0.35rem;
  }

  .diff-body pre {
    margin: 0;
    padding: 0.5rem 0;
    font-family: var(--mono);
    font-size: 0.76rem;
    line-height: 1.55;
    tab-size: 2;
    white-space: pre;
    min-width: max-content;
  }

  .dl {
    display: block;
    padding: 0 0.8rem 0 0.65rem;
    border-left: 3px solid transparent;
  }

  .dl-add { background: var(--add-bg); border-left-color: var(--add-edge); }
  .dl-rm { background: var(--rm-bg); border-left-color: var(--rm-edge); }
  .dl-hunk {
    background: var(--hunk-bg);
    border-left-color: var(--hunk);
    color: var(--hunk);
    font-weight: 600;
  }
  .dl-meta { color: var(--ink-faint); font-style: italic; }

  /* monaco hosts itself in here when it loads; the plain renderer above is
     used when it doesn't (the artifact host's CSP blocks the cdn) */
  .diff-monaco {
    margin-top: 0.35rem;
    border: 1px solid var(--rule);
    height: 22rem;
    max-height: 70vh;
  }

  .diff-monaco .monaco-editor .diffOverview { display: none; }

  .editor-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.35rem;
    font-size: 0.76rem;
    color: var(--ink-faint);
  }

  .editor-bar .hint { flex: 1; }
  .editor-bar .state-dirty { color: var(--mod); }
  .editor-bar .state-saved { color: var(--new); }
  .editor-bar .state-error { color: var(--del); }

  button.save {
    font-family: var(--body);
    font-size: 0.76rem;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid transparent;
    padding: 0.22rem 0.6rem;
    cursor: pointer;
  }

  button.save.revert { color: var(--del); background: var(--del-bg); }
  button.save[disabled] { color: var(--ink-faint); background: transparent; cursor: default; }
  button.save:not([disabled]):hover { border-color: var(--accent); }
  button.save:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* a review note, living in a monaco view zone between two lines. view zones
     paint below the editor's own text layer, so it has to be lifted for its
     buttons to be clickable at all */
  .note-zone {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0.5rem 0.6rem 0.6rem calc(3.5rem + 26px);
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    font-family: var(--body);
  }

  .note-zone textarea {
    font-family: var(--body);
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 0.35rem 0.45rem;
    resize: none;
    width: 100%;
  }

  .note-zone textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  .note-zone .note-actions {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
  }

  .note-zone .note-stamp {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--ink-faint);
  }

  .note-thread {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-height: 9rem;
    overflow-y: auto;
  }

  .note-message {
    margin: 0;
    font-size: 0.86rem;
    line-height: 1.4;
    color: var(--ink);
  }

  .note-who {
    display: inline-block;
    min-width: 3.4rem;
    margin-right: 0.4rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .note-from-agent .note-who { color: var(--accent); }

  /* the thread's last word is the reviewer's, so a reply is coming */
  .note-pending {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.78rem;
    color: var(--accent);
  }

  .note-pending .dots {
    display: inline-flex;
    gap: 3px;
  }

  .note-pending .dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: note-thinking 1.1s infinite ease-in-out;
  }

  .note-pending .dots i:nth-child(2) { animation-delay: 0.16s; }
  .note-pending .dots i:nth-child(3) { animation-delay: 0.32s; }

  @keyframes note-thinking {
    0%, 70%, 100% { opacity: 0.25; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .note-pending .dots i { animation: none; opacity: 0.7; }
  }

  .toasts {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 40;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-width: min(28rem, calc(100vw - 2rem));
  }

  .toast {
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--ink);
    background: var(--card);

  .toast-done { border-left-color: var(--add-edge); }

  .note-zone button:hover { border-color: var(--accent); color: var(--accent); }

  .noted-line {

  .noted-glyph::after {

  .callout {

  .callout strong { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {

  }

  /* narrow enough that a permanent sidebar would crowd the diffs out; it
     becomes an overlay opened from the header instead */

    .sidebar {
      position: fixed;
      top: var(--header-height, 3.2rem);
      left: 0;
      bottom: 0;
      z-index: 15;
      width: min(20rem, 82vw);

      background: var(--paper);
      box-shadow: 0 0 40px rgb(0 0 0 / 0.25);

  @media (max-width: 34rem) {

    .blurb { padding-left: 0; }

</style>

<script>PREACT_JS</script>

<div id="app"></div>

<!--REVIEW_SERVER-->
<script type="application/json" id="payload">PAYLOAD_JSON</script>
<script type="module">
  const {
    html,
    render,
    useState,
    useEffect,
    useLayoutEffect,
    useRef,
  } = htmPreact;

  const {
    id: REVIEW_ID,
    meta: META,
    groups: GROUPS,
    diffs: DIFFS,
    sides: SIDES,
    stats: STATS,
    links: LINKS,
  } = JSON.parse(document.getElementById("payload").textContent);

  document.title = META.title;

  const STATUS_LABEL = { A: "New", M: "Modified", D: "Deleted", R: "Renamed" };
  // keyed by review: without it every review served on this port would inherit
  // the last one's ticks
  const STORAGE_KEY = `guidedReviewTicks:${REVIEW_ID}`;
  const SERVER = window.__reviewServer;

  /** every file in reading order, carrying where it sits in the document */
  const FILES = GROUPS.flatMap((group, groupIndex) =>
    group.items.map((item, itemIndex) => ({
      ...item,
      groupIndex,
      id: `${groupIndex}-${itemIndex}`,
    })),
  );
  const TOTAL = FILES.length;

  /* ---- a store the imperative side can share with the component tree ------
     monaco's view zones and the server poll live outside preact - they push
     into these, and anything rendered from them re-renders */

  const makeStore = (initial) => {
    let value = initial;
    const listeners = new Set();
    return {
      get: () => value,
      set: (next) => {
        value = next;
        for (const listener of listeners) {
          listener();
        }
      },
      subscribe: (listener) => {
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
    };
  };

  const useStore = (store) => {
    const [, bump] = useState(0);
    useEffect(() => store.subscribe(() => bump((version) => version + 1)), [store]);
    return store.get();
  };

  const notesStore = makeStore({});
  const toastStore = makeStore([]);

  let lastToastId = 0;

  const toast = (text, kind = "info") => {
    const id = (lastToastId += 1);
    toastStore.set([...toastStore.get(), { id, text, kind, leaving: false }]);
    setTimeout(
      () =>
        toastStore.set(
          toastStore.get().map((entry) => (entry.id === id ? { ...entry, leaving: true } : entry)),
        ),
      7_000,
    );
    setTimeout(() => toastStore.set(toastStore.get().filter((entry) => entry.id !== id)), 7_600);
  };

  /* ---- ticks --------------------------------------------------------------
     Served, what has been read is the review's own file - so it survives a
     rebuild into another scratchpad or onto another port, two tabs on the same
     review agree, and the agent can see how far the reading has got. Without a
     server there is nowhere to write, and localStorage keyed by review id is
     the whole of it. */

  const localTicks = () => {
    try {
      return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]"));
    } catch {
      return new Set();
    }
  };

  const loadTicks = async () => {
    if (SERVER === undefined) {
      return localTicks();
    }
    const response = await fetch("/ticks").catch(() => undefined);
    return new Set(response?.ok ? (await response.json()).ticked : []);
  };

  /** ticks the page has taken from the file, so the poll can tell a change made
      somewhere else from the echo of one made here */
  const adoptTicks = makeStore(new Set());
  const ticksSignature = (ticked) => JSON.stringify([...ticked].sort());
  let lastFromServer = "[]";

  /** while a write is in flight the page is ahead of the file, so the poll
      must not hand it back what it is in the middle of replacing */
  let ticksInFlight = 0;
  let queuedTicks;

  const postTicks = async () => {
    const ticked = queuedTicks;
    queuedTicks = undefined;
    const response = await fetch("/ticks", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
      body: JSON.stringify({ ticked: [...ticked] }),
    }).catch(() => undefined);
    ticksInFlight -= 1;
    if (response?.ok !== true) {
      toast("ticks not saved — the review server isn't answering", "warn");
      return;
    }
    lastFromServer = ticksSignature(ticked);
  };

  const saveTicks = (ticked) => {
    if (SERVER === undefined) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...ticked]));
      } catch {
        /* storage unavailable - ticks just won't persist */
      }
      return;
    }
    // ticking a whole group is one state change but many clicks are not, so
    // the writes are coalesced rather than one per checkbox
    const first = queuedTicks === undefined;
    queuedTicks = ticked;
    if (first) {
      ticksInFlight += 1;
      setTimeout(postTicks, 250);
    }
  };

  const withMembership = (set, key, member) => {
    const next = new Set(set);
    if (member) {
      next.add(key);
    } else {
      next.delete(key);
    }
    return next;
  };

  /* ---- review notes -------------------------------------------------------
     A note belongs to a line of the modified side, and is a thread: what you
     asked for, and what the agent said back. Served, they persist to a json
     file beside the review; without a server there is nowhere for them to go,
     so the whole note-authoring surface stays off. */

  const notesFor = (path) => notesStore.get()[path] ?? [];
  const noteAt = (path, line) => notesFor(path).find((note) => note.line === line);

  /** the single-text shape a note started as reads as its first message */
  const messagesOf = (note) =>
    note === undefined ? []
    : note.messages ?? [{ from: "reviewer", text: note.text }];

  const loadNotes = async () => {
    if (SERVER === undefined) {
      return;
    }
    const response = await fetch("/notes").catch(() => undefined);
    notesStore.set(response?.ok ? await response.json() : {});
  };

  const saveNotes = async () => {
    if (SERVER === undefined) {
      return;
    }
    const response = await fetch("/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
      body: JSON.stringify(notesStore.get()),
    }).catch(() => undefined);

    // silence here would be the worst kind: the note looks written and isn't
    if (response?.ok !== true) {
      toast(
        response?.status === 403 ?
          "note not saved — this page is older than the server. Reload it"
        : "note not saved — the review server isn't answering",
        "warn",
      );
    }
  };

  const sayOnNote = (path, line, text) => {
    if (text.trim() === "") {
      return;
    }
    const forPath = notesFor(path);
    const said = { from: "reviewer", text };
    const updated =
      noteAt(path, line) === undefined ?
        [...forPath, { line, messages: [said] }].sort((a, b) => a.line - b.line)
      : forPath.map((note) =>
          note.line === line ? { line, messages: [...messagesOf(note), said] } : note,
        );
    notesStore.set({ ...notesStore.get(), [path]: updated });
    saveNotes();
  };

  const removeNote = (path, line) => {
    const remaining = notesFor(path).filter((note) => note.line !== line);
    const next = { ...notesStore.get() };
    if (remaining.length === 0) {
      delete next[path];
    } else {
      next[path] = remaining;
    }
    notesStore.set(next);
    saveNotes();
  };

  const notesAsMarkdown = () =>
    Object.entries(notesStore.get())
      .map(
        ([path, forPath]) =>
          `### ${path}\n` +
          forPath
            .map((note) =>
              messagesOf(note)
                .map((message, index) =>
                  index === 0 ?
                    `- L${note.line}: ${message.text}`
                  : `  - ${message.from}: ${message.text}`,
                )
                .join("\n"),
            )
            .join("\n"),
      )
      .join("\n\n");

  /* ---- monaco ------------------------------------------------------------- */

  const MONACO_VERSION = "0.52.2";
  const MONACO_BASE = `https://cdn.jsdelivr.net/npm/monaco-editor@${MONACO_VERSION}/min/vs`;
  const MONACO_TIMEOUT_MS = 6_000;

  const LANGUAGES = {
    ts: "typescript",
    tsx: "typescript",
    js: "javascript",
    jsx: "javascript",
    mjs: "javascript",
    json: "json",
    md: "markdown",
    css: "css",
    html: "html",
    sh: "shell",
    py: "python",
    yml: "yaml",
    yaml: "yaml",
  };

  const languageFor = (path) =>
    LANGUAGES[path.split(".").pop().toLowerCase()] ?? "plaintext";

  const pageIsDark = () => {
    const stamped = document.documentElement.dataset.theme;
    if (stamped === "dark") return true;
    if (stamped === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  };

  /** monaco themes carrying the same palette as the rest of the page */
  const defineReviewThemes = () => {
    const shared = {
      "editor.background": "#00000000",
      "editorGutter.background": "#00000000",
      "diffEditor.insertedTextBackground": "#2ea17c33",
      "diffEditor.removedTextBackground": "#e55f4433",
      "diffEditor.insertedLineBackground": "#2ea17c1f",
      "diffEditor.removedLineBackground": "#e55f441f",
    };
    monaco.editor.defineTheme("review-light", {
      base: "vs",
      inherit: true,
      rules: [],
      colors: { ...shared, "editorLineNumber.foreground": "#7c6e6c" },
    });
    monaco.editor.defineTheme("review-dark", {
      base: "vs-dark",
      inherit: true,
      rules: [],
      colors: { ...shared, "editorLineNumber.foreground": "#9a8d8a" },
    });
  };

  /** resolves to the monaco module, or undefined when it can't be had */
  let monacoPromise;

  const loadMonaco = () => {
    if (monacoPromise !== undefined) {
      return monacoPromise;
    }
    monacoPromise = new Promise((resolve, reject) => {
      // cross-origin workers have to be bootstrapped through a blob that
      // imports the real worker from the cdn. baseUrl is the directory *above*
      // vs/, since the worker resolves module ids that already start with vs/
      self.MonacoEnvironment = {
        getWorkerUrl: () =>
          URL.createObjectURL(
            new Blob(
              [
                `self.MonacoEnvironment = { baseUrl: "${MONACO_BASE.replace(/\/vs$/, "/")}" };\n` +
                  `importScripts("${MONACO_BASE}/base/worker/workerMain.js");`,
              ],
              { type: "text/javascript" },
            ),
          ),
      };

      const timeout = setTimeout(() => reject(new Error("monaco timed out")), MONACO_TIMEOUT_MS);
      const script = document.createElement("script");
      script.src = `${MONACO_BASE}/loader.js`;
      script.addEventListener("error", () => {
        clearTimeout(timeout);
        reject(new Error("monaco could not be loaded"));
      });
      script.addEventListener("load", () => {
        try {
          window.require.config({ paths: { vs: MONACO_BASE } });
          window.require(["vs/editor/editor.main"], () => {
            clearTimeout(timeout);
            // nothing here is edited against a real project, so the language
            // services would only cost a multi-megabyte worker download to
            // report errors this page isn't fixing
            for (const defaults of [
              monaco.languages.typescript.typescriptDefaults,
              monaco.languages.typescript.javascriptDefaults,
            ]) {
              defaults.setDiagnosticsOptions({
                noSemanticValidation: true,
                noSyntacticValidation: true,
                noSuggestionDiagnostics: true,
              });
              // ...and jsx has to be allowed, or every tag in a .tsx parses as
              // a type assertion and the file fills with "'>' expected"
              defaults.setCompilerOptions({
                ...defaults.getCompilerOptions(),
                jsx: monaco.languages.typescript.JsxEmit.Preserve,
                allowJs: true,
                allowNonTsExtensions: true,
                target: monaco.languages.typescript.ScriptTarget.ESNext,
              });
            }
            defineReviewThemes();
            monaco.editor.setTheme(pageIsDark() ? "review-dark" : "review-light");
            resolve(monaco);
          });
        } catch (error) {
          clearTimeout(timeout);
          reject(error);
        }
      });
      document.head.append(script);
    }).catch((error) => {
      console.warn("falling back to the plain diff renderer:", error.message);
      return undefined;
    });
    return monacoPromise;
  };

  const applyMonacoTheme = () => {
    if (window.monaco !== undefined) {
      monaco.editor.setTheme(pageIsDark() ? "review-dark" : "review-light");
    }
  };

  window
    .matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", applyMonacoTheme);
  new MutationObserver(applyMonacoTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"],
  });

  /** the diff editors currently on the page, so the poll below can update them */
  const liveEditors = new Map();
  /** every rendered file row, so the sidebar can scroll to one by id */
  const rowNodes = new Map();
  /** while a click from the sidebar is still travelling, that file is the
      current one - whatever the rows crossing the viewport say on the way */
  let followScrollAfter = 0;

  /* ---- components --------------------------------------------------------- */

  const awaitingReply = (messages) =>
    SERVER !== undefined &&
    messages.length > 0 &&
    messages[messages.length - 1].from !== "agent";

  /** what has been typed but not sent, so a redraw mid-sentence loses nothing */
  const drafts = new Map();
  /** the one line whose box should take the caret on this draw */
  let focusLine;

  /**
   * the note ui that sits in a monaco view zone under its line: the thread so
   * far, and a box that is always open, because replying is the point rather
   * than a mode you have to enter
   */
  const NoteZone = ({ path, line, done }) => {
    useStore(notesStore);
    const messages = messagesOf(noteAt(path, line));
    const draftKey = `${path}:${line}`;
    const [draft, setDraft] = useState(drafts.get(draftKey) ?? "");
    const textareaRef = useRef(null);

    // only the box just opened takes the caret - a poll redrawing every zone
    // must not steal it from wherever you are typing
    useLayoutEffect(() => {
      if (focusLine !== line) {
        return;
      }
      focusLine = undefined;
      // monaco puts a zone's dom into the document on its own render frame,
      // not when the zone is added, and focusing an element that is not in the
      // document yet does nothing at all - so ask until it takes
      let attempts = 0;
      const takeCaret = () => {
        const textarea = textareaRef.current;
        if (textarea === null) {
          return;
        }
        textarea.focus();
        if (document.activeElement !== textarea && (attempts += 1) < 10) {
          requestAnimationFrame(takeCaret);
        }
      };
      takeCaret();
    }, [line]);

    const send = () => {
      sayOnNote(path, line, draft);
      drafts.delete(draftKey);
      focusLine = line;
      done();
    };

    const type = (value) => {
      drafts.set(draftKey, value);
      setDraft(value);
    };

    // the zone's own dom node belongs to monaco, which writes an inline display
    // onto it - so the layout lives on a wrapper of ours inside it
    return html`<div class="note-zone">
      ${messages.length > 0 &&
      html`<div class="note-thread">
        ${messages.map(
          (message, index) => html`
            <p class="note-message note-from-${message.from}" key=${index}>
              <span class="note-who">${message.from === "agent" ? "claude" : "you"}</span>
              ${message.text}
            </p>
          `,
        )}
        ${awaitingReply(messages) &&
        html`<div class="note-pending">
          <span class="dots"><i /><i /><i /></span>
          <span>claude is on it — the reply lands here</span>
        </div>`}
      </div>`}

      <textarea
        ref=${textareaRef}
        rows="2"
        value=${draft}
        placeholder=${messages.length === 0 ?
          `note on line ${line} — ask for a change, or say what you think`
        : "reply…"}
        onInput=${(event) => type(event.currentTarget.value)}
        onKeyDown=${(event) => {
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            send();
          }
        }}
      />

      <div class="note-actions">
        <button type="button" onClick=${send}>
          ${messages.length === 0 ? "Save note" : "Send"}
        </button>
        ${messages.length === 0 ?
          html`<button
            type="button"
            onClick=${() => {
              drafts.delete(draftKey);
              done();
            }}
          >
            Cancel
          </button>`
        : html`<button
            type="button"
            onClick=${() => {
              drafts.delete(draftKey);
              removeNote(path, line);
              done();
            }}
          >
            Delete
          </button>`}
        <span class="note-stamp">line ${line} · ⌘↵ sends</span>
      </div>
    </div>`;
  };

  /** the patch, rendered as coloured lines - the fallback when monaco is absent */
  const diffLineClass = (line) => {
    if (line.startsWith("@@")) return "dl dl-hunk";
    if (line.startsWith("+")) return "dl dl-add";
    if (line.startsWith("-")) return "dl dl-rm";
    if (line.startsWith("…")) return "dl dl-meta";
    return "dl";
  };

  // the lines are the pre's only children: any literal whitespace in the
  // template around them would print as part of the patch
  const PatchDiff = ({ path }) =>
    html`<div class="diff-body">
      <pre>
        ${(DIFFS[path] ?? "")
          .split("\n")
          .map(
            (line, index) =>
              html`<span class=${diffLineClass(line)} key=${index}>
                ${line === "" ? " " : line}
              </span>`,
          )}
      </pre>
    </div>`;

  /**
   * creates the monaco diff editor for one file and everything hung off it:
   * saving back to the working tree, and the note zones. Imperative by nature -
   * monaco owns this dom - and reports back through the setters it is given
   */
  const createDiffEditor = (host, path, { setCounts, setDirty, setStatus }) => {
    const side = SIDES[path];
    const language = languageFor(path);
    const editor = monaco.editor.createDiffEditor(host, {
      // served, the working copy is editable and can be written back
      readOnly: SERVER === undefined,
      originalEditable: false,
      renderSideBySide: false,
      automaticLayout: true,
      glyphMargin: true,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      renderOverviewRuler: false,
      fontSize: 12,
      lineHeight: 18,
      // unchanged stretches collapse to a foldable band, which is the whole
      // reason for using an editor over a static patch
      hideUnchangedRegions: { enabled: true, contextLineCount: 3, minimumLineCount: 4 },
      // let the page keep scrolling when the pointer crosses an editor
      scrollbar: { alwaysConsumeMouseWheel: false },
    });
    // the model's uri decides the typescript worker's script kind, so it has to
    // carry the real extension - an extensionless uri parses .tsx as .ts
    const modelFor = (content, which) =>
      monaco.editor.createModel(
        content,
        language,
        monaco.Uri.parse(`inmemory://review/${which}/${path}`),
      );
    const original = modelFor(side.before, "original");
    const modified = modelFor(side.after, "modified");
    editor.setModel({ original, modified });

    const modifiedEditor = editor.getModifiedEditor();

    let sha = side.sha;
    let dirty = false;

    // note authoring/collaboration (view zones, the gutter "+" glyph, the
    // alt-N/context-menu action, save/revert, and the live-file poll) only
    // make sense with serve.py behind the page to persist and relay them -
    // without a server they'd be dead controls, so standalone opens stay
    // read-only and none of this wiring runs at all
    if (SERVER !== undefined) {
      let zoneIds = [];
      const decorations = modifiedEditor.createDecorationsCollection([]);
      let editing;

      const drawNotes = () => {
        const lines = new Set([
          ...notesFor(path).map((note) => note.line),
          ...(editing === undefined ? [] : [editing]),
        ]);

        modifiedEditor.changeViewZones((accessor) => {
          for (const id of zoneIds) {
            accessor.removeZone(id);
          }
          zoneIds = [...lines].map((line) => {
            const isEditing = line === editing;
            const said = messagesOf(noteAt(path, line)).length;
            const domNode = document.createElement("div");
            render(
              html`<${NoteZone}
                path=${path}
                line=${line}
                done=${() => {
                  editing = undefined;
                  drawNotes();
                }}
              />`,
              domNode,
            );
            return accessor.addZone({
              afterLineNumber: line,
              // grows with the conversation, up to the thread's own scroll cap
              heightInPx: Math.min(46 + said * 26, 190) + (isEditing ? 86 : 0),
              // without this the editor eats the mousedown before the note's own
              // controls ever see it
              suppressMouseDown: false,
              domNode,
            });
          });
        });

        decorations.set(
          notesFor(path).map((note) => ({
            range: new monaco.Range(note.line, 1, note.line, 1),
            options: {
              isWholeLine: true,
              className: "noted-line",
              glyphMarginClassName: "noted-glyph",
            },
          })),
        );
      };

      modifiedEditor.addAction({
        id: "add-review-note",
        label: "Add review note",
        contextMenuGroupId: "navigation",
        keybindings: [monaco.KeyMod.Alt | monaco.KeyCode.KeyN],
        run: (instance) => {
          editing = instance.getPosition().lineNumber;
          focusLine = editing;
          drawNotes();
        },
      });

      /* a + in the gutter of whichever line the mouse is on, so adding a note
         is something you can see rather than something you have to know */
      const hoverGlyph = modifiedEditor.createDecorationsCollection([]);
      const markHoveredLine = (line) => {
        hoverGlyph.set(
          line === undefined || notesFor(path).some((note) => note.line === line) ?
            []
          : [
              {
                range: new monaco.Range(line, 1, line, 1),
                options: {
                  glyphMarginClassName: "add-note-glyph",
                  glyphMarginHoverMessage: { value: "Add a review note (alt-N)" },
                },
              },
            ],
        );
      };

      modifiedEditor.onMouseMove((event) => markHoveredLine(event.target.position?.lineNumber));
      modifiedEditor.onMouseLeave(() => markHoveredLine(undefined));
      modifiedEditor.onMouseDown((event) => {
        if (event.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN) {
          editing = event.target.position.lineNumber;
          focusLine = editing;
          drawNotes();
        }
      });

      modified.onDidChangeContent(() => {
        dirty = true;
        setDirty(true);
        setStatus({ kind: "state-dirty", text: "unsaved" });
      });

      // the page follows the file: when an agent acts on a note the diff here
      // catches up on its own, rather than going quietly out of date
      liveEditors.set(path, {
        sha: () => sha,
        refreshNotes: drawNotes,
        applyFromDisk: (file) => {
          if (dirty) {
            toast(`${path} changed on disk — Revert to load it`, "warn");
            return;
          }
          modified.setValue(file.after);
          sha = file.sha;
          setDirty(false);
          setCounts([file.added, file.removed]);
        },
      });

      drawNotes();
    }

    editor.onDidUpdateDiff(() => {
      const lines = modifiedEditor.getContentHeight() / 18;
      const height = Math.min(Math.max(lines * 18 + 24, 120), window.innerHeight * 0.7);
      host.style.height = `${Math.round(height)}px`;
      editor.layout();
    });

    return {
      dispose: () => {
        liveEditors.delete(path);
        editor.dispose();
        original.dispose();
        modified.dispose();
      },
      // puts the file back the way the review found it - but only in the
      // editor, so nothing reaches disk without a deliberate Save
      revert: () => {
        modified.setValue(side.after);
        setStatus({ kind: "state-dirty", text: "reverted — save to write it back" });
      },
      save: async () => {
        setStatus({ kind: "", text: "saving…" });
        const response = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
          body: JSON.stringify({ path, content: modified.getValue(), sha }),
        }).catch(() => undefined);

        if (response?.ok) {
          const result = await response.json();
          sha = result.sha;
          dirty = false;
          setDirty(false);
          setCounts([result.added, result.removed]);
          setStatus({ kind: "state-saved", text: `saved  +${result.added} −${result.removed}` });
          return;
        }
        setStatus({
          kind: "state-error",
          text: response?.status === 409 ? "changed on disk — reload before saving" : "save failed",
        });
      },
    };
  };

  const MonacoDiff = ({ path, setCounts }) => {
    const hostRef = useRef(null);
    const controls = useRef(undefined);
    const [fallback, setFallback] = useState(false);
    const [dirty, setDirty] = useState(false);
    const [status, setStatus] = useState({ kind: "", text: "" });

    useEffect(() => {
      let live = true;
      loadMonaco().then((monacoModule) => {
        if (!live) {
          return;
        }
        if (monacoModule === undefined || SIDES[path] === undefined) {
          setFallback(true);
          return;
        }
        controls.current = createDiffEditor(hostRef.current, path, {
          setCounts,
          setDirty,
          setStatus,
        });
      });
      return () => {
        live = false;
        controls.current?.dispose();
        controls.current = undefined;
      };
    }, [path, setCounts]);

    if (fallback) {
      return html`<${PatchDiff} path=${path} />`;
    }

    return html`
      <div class="diff-monaco" ref=${hostRef} />
      <div class="editor-bar">
        <span class="hint">
          ${SERVER === undefined ?
            "read-only — open with serve.py to edit and leave review notes"
          : "editable — hover a line and click + to add a note"}
        </span>
        <span class=${status.kind}>${status.text}</span>
        ${SERVER !== undefined &&
        html`<button
          type="button"
          class="save revert"
          title="back to the content this review was built from"
          onClick=${() => controls.current?.revert()}
        >
          Revert
        </button>`}
        ${SERVER !== undefined &&
        html`<button
          type="button"
          class="save"
          disabled=${!dirty}
          onClick=${() => controls.current?.save()}
        >
          Save
        </button>`}
      </div>
    `;
  };

  const Row = ({ file, ticked, collapsed, diffOpen, active, onTick, onCollapse, onDiff }) => {
    const [counts, setCounts] = useState(STATS[file.path] ?? [0, 0]);
    const [copied, setCopied] = useState(false);
    // opening a diff mounts its editor; closing only hides it, so an unsaved
    // edit survives the file being ticked away and reopened
    const [mounted, setMounted] = useState(false);
    const notes = useStore(notesStore)[file.path] ?? [];
    const nodeRef = useRef(null);

    // the sidebar scrolls to these, and the app watches them to know which file
    // is being read
    useEffect(() => {
      nodeRef.current.dataset.rowId = file.id;
      rowNodes.set(file.id, nodeRef.current);
      return () => rowNodes.delete(file.id);
    }, [file.id]);

    useEffect(() => {
      if (diffOpen) {
        setMounted(true);
      }
    }, [diffOpen]);

    const copyPath = async () => {
      try {
        await navigator.clipboard.writeText(file.path);
        setCopied(true);
        setTimeout(() => setCopied(false), 900);
      } catch {
        /* clipboard blocked - the path is selectable anyway */
      }
    };

    const [added, removed] = counts;
    const href = LINKS?.[file.path];

    return html`
      <div
        class="row ${ticked ? "is-ticked" : ""} ${active ? "is-active" : ""}"
        ref=${nodeRef}
        data-path=${file.path}
      >
        <div class="row-head" onClick=${() => onCollapse(!collapsed)}>
          <input
            class="tick"
            type="checkbox"
            checked=${ticked}
            aria-label=${`Read ${file.path}`}
            onClick=${(event) => event.stopPropagation()}
            onChange=${(event) => onTick(event.currentTarget.checked)}
          />
          <span class="chip chip-${file.status}">
            ${STATUS_LABEL[file.status] ?? file.status}
          </span>
          <button
            type="button"
            class="path ${copied ? "copied" : ""}"
            title="Copy path"
            onClick=${(event) => {
              event.stopPropagation();
              copyPath();
            }}
          >
            ${file.path}
          </button>
          ${href !== undefined &&
          html`<a
            class="github"
            href=${href}
            target="_blank"
            rel="noreferrer"
            onClick=${(event) => event.stopPropagation()}
          >
            GitHub ↗
          </a>`}
          ${notes.length > 0 && html`<span class="note-count">${notes.length}</span>`}
          <span class="row-stat">
            <span class="stat-add">+${added}</span> <span class="stat-rm">−${removed}</span>
          </span>
          <button
            type="button"
            class="caret"
            aria-expanded=${String(!collapsed)}
            aria-label=${collapsed ? "Expand this file" : "Collapse this file"}
            onClick=${(event) => {
              event.stopPropagation();
              onCollapse(!collapsed);
            }}
          >
            ${collapsed ? "▸" : "▾"}
          </button>
        </div>

        <div class="row-body" hidden=${collapsed}>
          <p class="note" dangerouslySetInnerHTML=${{ __html: file.note ?? "" }} />
          <div class="diff">
            <button
              type="button"
              class="diff-toggle"
              aria-expanded=${String(diffOpen)}
              onClick=${() => onDiff(!diffOpen)}
            >
              <span>${diffOpen ? "Hide diff" : "Show diff"}</span>
            </button>
            ${mounted &&
            html`<div hidden=${!diffOpen}>
              <${MonacoDiff} path=${file.path} setCounts=${setCounts} />
            </div>`}
          </div>
        </div>
      </div>
    `;
  };

  const Group = ({ group, index, files, open, state }) => {
    const done = files.filter((file) => state.ticked.has(file.path)).length;

    return html`
      <section class="group ${open ? "is-open" : ""}">
        <div class="group-head" onClick=${() => state.openGroup(index, !open)}>
          <input
            class="tick"
            type="checkbox"
            checked=${done === files.length}
            indeterminate=${done > 0 && done < files.length}
            aria-label=${`Tick every file in ${group.title}`}
            onClick=${(event) => event.stopPropagation()}
            onChange=${(event) => state.tickGroup(index, event.currentTarget.checked)}
          />
          <span class="step">${index + 1}</span>
          <span class="group-title">${group.title}</span>
          <span class="group-count">${done}/${files.length} files</span>
          <button
            type="button"
            class="caret"
            aria-expanded=${String(open)}
            aria-label=${open ? "Collapse this group" : "Expand this group"}
            onClick=${(event) => {
              event.stopPropagation();
              state.openGroup(index, !open);
            }}
          >
            ${open ? "▾" : "▸"}
          </button>
        </div>

        <div class="group-body" hidden=${!open}>
          <p class="blurb" dangerouslySetInnerHTML=${{ __html: group.blurb ?? "" }} />
          <div class="rows">
            ${files.map(
              (file) => html`
                <${Row}
                  key=${file.id}
                  file=${file}
                  ticked=${state.ticked.has(file.path)}
                  collapsed=${state.collapsed.has(file.id)}
                  diffOpen=${state.openDiffs.has(file.id)}
                  active=${state.activeId === file.id}
                  onTick=${(on) => state.tickFile(file, on)}
                  onCollapse=${(on) => state.collapseFile(file.id, on)}
                  onDiff=${(on) => state.openDiff(file.id, on)}
                />
              `,
            )}
          </div>
        </div>
      </section>
    `;
  };

  const basename = (path) => path.slice(path.lastIndexOf("/") + 1);
  const dirname = (path) => (path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "");

  /** narrow enough that the contents overlays the reading rather than sitting
      beside it - so it starts closed, and closes again once it has been used */
  const contentsWouldOverlay = () => window.matchMedia("(max-width: 60rem)").matches;

  const Sidebar = ({ state }) => {
    const notes = useStore(notesStore);

    return html`
      <aside class="sidebar" id="contents" aria-label="Contents">
        <p class="sidebar-title">contents</p>
        <nav>
          <ol class="tree">
            ${GROUPS.map((group, index) => {
              const files = FILES.filter((file) => file.groupIndex === index);
              const done = files.filter((file) => state.ticked.has(file.path)).length;
              return html`
                <li class="tree-group" key=${index}>
                  <div class="tree-group-head">
                    <input
                      class="tick small"
                      type="checkbox"
                      checked=${done === files.length}
                      indeterminate=${done > 0 && done < files.length}
                      aria-label=${`Tick every file in ${group.title}`}
                      onChange=${(event) => state.tickGroup(index, event.currentTarget.checked)}
                    />
                    <span class="tree-step">${index + 1}</span>
                    <button
                      type="button"
                      class="tree-group-title"
                      title=${group.title}
                      onClick=${() => state.goTo(files[0])}
                    >
                      ${group.title}
                    </button>
                    <span class="tree-count">${done}/${files.length}</span>
                  </div>
                  <ul class="tree-files">
                    ${files.map((file) => {
                      const ticked = state.ticked.has(file.path);
                      const noted = (notes[file.path] ?? []).length;
                      return html`
                        <li
                          class="tree-file ${ticked ? "is-ticked" : ""} ${
                            state.activeId === file.id ? "is-active" : ""
                          }"
                          key=${file.id}
                        >
                          <input
                            class="tick small"
                            type="checkbox"
                            checked=${ticked}
                            aria-label=${`Read ${file.path}`}
                            onChange=${(event) => state.tickFile(file, event.currentTarget.checked)}
                          />
                          <button
                            type="button"
                            class="tree-file-link"
                            title=${file.path}
                            onClick=${() => state.goTo(file)}
                          >
                            <span class="tree-base">${basename(file.path)}</span>
                            <span class="tree-dir"><span>${dirname(file.path)}</span></span>
                          </button>
                          ${noted > 0 && html`<span class="note-count">${noted}</span>`}
                        </li>
                      `;
                    })}
                  </ul>
                </li>
              `;
            })}
          </ol>
        </nav>
      </aside>
    `;
  };

  const Toasts = () => {
    const toasts = useStore(toastStore);
    return html`
      <div class="toasts" aria-live="polite">
        ${toasts.map(
          (entry) => html`
            <div
              class="toast toast-${entry.kind} ${entry.leaving ? "leaving" : ""}"
              role="status"
              key=${entry.id}
            >
              ${entry.text}
            </div>
          `,
        )}
      </div>
    `;
  };

  const Header = ({ state }) => {
    const [copyLabel, setCopyLabel] = useState("Copy notes");
    const [handoffLabel, setHandoffLabel] = useState("Send notes to agent");
    const headerRef = useRef(null);

    // the sidebar and the group headings stick below this header, whatever
    // height its controls wrap to
    useLayoutEffect(() => {
      const measure = () =>
        document.documentElement.style.setProperty(
          "--header-height",
          `${headerRef.current.getBoundingClientRect().height}px`,
        );
      const observer = new ResizeObserver(measure);
      observer.observe(headerRef.current);
      measure();
      return () => observer.disconnect();
    }, []);

    const copyNotes = async () => {
      const markdown = notesAsMarkdown();
      if (markdown === "") {
        setCopyLabel("No notes yet");
      } else {
        await navigator.clipboard.writeText(markdown).catch(() => undefined);
        setCopyLabel("Notes copied");
      }
      setTimeout(() => setCopyLabel("Copy notes"), 1_200);
    };

    const handOff = async () => {
      const response = await fetch("/handoff", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
        body: JSON.stringify(notesStore.get()),
      }).catch(() => undefined);
      const result = response?.ok ? await response.json() : undefined;
      setHandoffLabel(
        result === undefined ? "Send failed"
        : result.count === 0 ? "No notes yet"
        : `Sent ${result.count} — ask the agent to pick them up`,
      );
      setTimeout(() => setHandoffLabel("Send notes to agent"), 4_000);
    };

    const done = state.ticked.size;

    return html`
      <header class="top" ref=${headerRef}>
        <div class="top-inner">
          <p class="top-title">${META.headerTitle ?? META.title}</p>
          <div class="meter">
            <div class="track">
              <div
                class="fill"
                style=${`width: ${TOTAL === 0 ? 0 : (done / TOTAL) * 100}%`}
              />
            </div>
            <span class="count">${done}/${TOTAL}</span>
          </div>
          <div class="controls">
            <button
              class="control"
              type="button"
              aria-pressed=${String(state.showContents)}
              aria-controls="contents"
              onClick=${() => state.setShowContents(!state.showContents)}
            >
              Contents
            </button>
            <button class="control" type="button" onClick=${() => state.setAllDiffs(true)}>
              Open all diffs
            </button>
            <button class="control" type="button" onClick=${() => state.setAllDiffs(false)}>
              Close all
            </button>
            <button class="control" type="button" onClick=${copyNotes}>${copyLabel}</button>
            ${SERVER !== undefined &&
            html`<button class="control" type="button" onClick=${handOff}>
              ${handoffLabel}
            </button>`}
            <button class="control" type="button" onClick=${state.clearTicks}>Clear ticks</button>
          </div>
        </div>
      </header>
    `;
  };

  const Intro = () => {
    const totals = Object.values(STATS).reduce(
      ([added, removed], [a, r]) => [added + a, removed + r],
      [0, 0],
    );
    const facts = [`${TOTAL} files`, `+${totals[0]} −${totals[1]} lines`, ...(META.facts ?? [])];

    return html`
      <section class="intro">
        <p class="eyebrow">${META.eyebrow ?? "reading order"}</p>
        <h1>${META.title}</h1>
        <p class="lede" dangerouslySetInnerHTML=${{ __html: META.lede ?? "" }} />
        <ul class="facts">
          ${facts.map(
            (fact, index) => html`<li key=${index} dangerouslySetInnerHTML=${{ __html: fact }} />`,
          )}
        </ul>
        ${SERVER === undefined &&
        html`<div class="callout">
          <strong>Read-only build.</strong> This review was generated in a sandbox, so there is no
          live agent behind this page — leaving in-page notes and chatting back to the agent are not
          possible here. Read and tick through; to send feedback, paste it into your chat with the
          agent.
        </div>`}
      </section>
    `;
  };

  /* ---- the app ------------------------------------------------------------ */

  const App = () => {
    const [ticked, setTicked] = useState(INITIAL_TICKS);
    // a file already read loads folded away, so a reload picks up where the
    // reading did rather than reopening everything
    const [collapsed, setCollapsed] = useState(
      () => new Set(FILES.filter((file) => ticked.has(file.path)).map((file) => file.id)),
    );
    const [closedGroups, setClosedGroups] = useState(
      () =>
        new Set(
          GROUPS.map((group, index) => index).filter((index) =>
            FILES.filter((file) => file.groupIndex === index).every((file) =>
              ticked.has(file.path),
            ),
          ),
        ),
    );
    const [openDiffs, setOpenDiffs] = useState(() => new Set());
    const [showContents, setShowContents] = useState(() => !contentsWouldOverlay());
    const [activeId, setActiveId] = useState(FILES[0]?.id);
    const [scrollTo, setScrollTo] = useState(undefined);
    const loaded = useRef(false);

    useEffect(() => {
      // the first run is the state that was just read back, and writing it
      // straight out again would only race the poll with itself
      if (loaded.current) {
        saveTicks(ticked);
      }
      loaded.current = true;
    }, [ticked]);

    // another tab on this review moving the file on under us: take its ticks,
    // and fold away whatever it has read since - but never unfold anything, or
    // it would reopen files deliberately folded here
    useEffect(
      () =>
        adoptTicks.subscribe(() => {
          const fresh = adoptTicks.get();
          setTicked(fresh);
          setCollapsed((folded) =>
            FILES.reduce(
              (set, file) =>
                fresh.has(file.path) && !ticked.has(file.path) ?
                  withMembership(set, file.id, true)
                : set,
              folded,
            ),
          );
        }),
      [ticked],
    );

    const tickFile = (file, on) => {
      setTicked((previous) => withMembership(previous, file.path, on));
      // reading a file folds it away; changing your mind brings it back
      setCollapsed((previous) => withMembership(previous, file.id, on));
    };

    const tickGroup = (index, on) => {
      const files = FILES.filter((file) => file.groupIndex === index);
      setTicked((previous) =>
        files.reduce((set, file) => withMembership(set, file.path, on), previous),
      );
      setCollapsed((previous) =>
        files.reduce((set, file) => withMembership(set, file.id, on), previous),
      );
      setClosedGroups((previous) => withMembership(previous, index, on));
    };

    const goTo = (file) => {
      if (file === undefined) {
        return;
      }
      setClosedGroups((previous) => withMembership(previous, file.groupIndex, false));
      setCollapsed((previous) => withMembership(previous, file.id, false));
      setActiveId(file.id);
      setScrollTo(file.id);
      followScrollAfter = performance.now() + 1_000;
      if (contentsWouldOverlay()) {
        setShowContents(false);
      }
    };

    // scrolling waits for the render that opened whatever the file was inside
    useEffect(() => {
      if (scrollTo === undefined) {
        return;
      }
      rowNodes.get(scrollTo)?.scrollIntoView({ block: "start", behavior: "smooth" });
      setScrollTo(undefined);
    }, [scrollTo]);

    /* which file the reader is on, so the sidebar tracks the main pane */
    useEffect(() => {
      const order = FILES.map((file) => file.id);
      const inView = new Set();
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              inView.add(entry.target.dataset.rowId);
            } else {
              inView.delete(entry.target.dataset.rowId);
            }
          }
          const first = order.find((id) => inView.has(id));
          if (first !== undefined && performance.now() > followScrollAfter) {
            setActiveId(first);
          }
        },
        // only the top band of the viewport counts as "where you are"
        { rootMargin: "-25% 0px -60% 0px" },
      );
      for (const node of rowNodes.values()) {
        observer.observe(node);
      }
      return () => observer.disconnect();
    }, []);

    const state = {
      ticked,
      collapsed,
      openDiffs,
      activeId,
      showContents,
      setShowContents,
      tickFile,
      tickGroup,
      goTo,
      collapseFile: (id, on) => setCollapsed((previous) => withMembership(previous, id, on)),
      openGroup: (index, on) => setClosedGroups((previous) => withMembership(previous, index, !on)),
      openDiff: (id, on) => setOpenDiffs((previous) => withMembership(previous, id, on)),
      // one control for the whole page: everything open to read, or everything
      // folded back to the bare reading order
      setAllDiffs: (on) => {
        setOpenDiffs(on ? new Set(FILES.map((file) => file.id)) : new Set());
        setCollapsed(on ? new Set() : new Set(FILES.map((file) => file.id)));
        if (on) {
          setClosedGroups(new Set());
        }
      },
      clearTicks: () => {
        setTicked(new Set());
        setCollapsed(new Set());
        setClosedGroups(new Set());
      },
    };

    return html`
      <${Header} state=${state} />
      <div class="layout">
        ${showContents && html`<${Sidebar} state=${state} />`}
        <div class="shell">
          <${Intro} />
          <main>
            ${GROUPS.map(
              (group, index) => html`
                <${Group}
                  key=${index}
                  group=${group}
                  index=${index}
                  files=${FILES.filter((file) => file.groupIndex === index)}
                  open=${!closedGroups.has(index)}
                  state=${state}
                />
              `,
            )}
          </main>
          <footer dangerouslySetInnerHTML=${{ __html: META.footer ?? "" }} />
        </div>
      </div>
      <${Toasts} />
    `;
  };

  await loadNotes();
  const INITIAL_TICKS = await loadTicks();
  lastFromServer = ticksSignature(INITIAL_TICKS);
  render(html`<${App} />`, document.getElementById("app"));

  /* ---- the page follows the working tree ----------------------------------
     an agent acting on a note shows up here within a couple of seconds, in the
     diff and in the note's own thread */

  const agentSaid = (state) =>
    Object.entries(state.notes).flatMap(([path, forPath]) =>
      forPath.flatMap((note) => {
        const was = messagesOf(noteAt(path, note.line)).length;
        return messagesOf(note)
          .slice(was)
          .filter((message) => message.from === "agent")
          .map((message) => ({ path, line: note.line, message }));
      }),
    );

  let missedPolls = 0;

  const pollState = async () => {
    const paths = [...liveEditors.keys()];
    const response = await fetch("/state", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
      body: JSON.stringify({ paths }),
    }).catch(() => undefined);

    if (response?.ok !== true) {
      missedPolls += 1;
      // the server can be restarted under an open tab; say so rather than
      // going quietly inert, which looks exactly like "nothing is happening"
      if (missedPolls === 3) {
        toast("lost the review server — saves and notes won't land. Reload this page", "warn");
      }
      return;
    }
    if (missedPolls >= 3) {
      toast("back in touch with the review server", "done");
    }
    missedPolls = 0;

    const state = await response.json();

    // a tick made in another tab on this review; while this one has a write in
    // flight the file is the stale side, so leave it alone
    const incoming = ticksSignature(state.ticked ?? []);
    if (incoming !== lastFromServer && ticksInFlight === 0) {
      lastFromServer = incoming;
      adoptTicks.set(new Set(state.ticked));
    }

    if (JSON.stringify(state.notes) !== JSON.stringify(notesStore.get())) {
      for (const { path, line, message } of agentSaid(state)) {
        toast(`${message.asking ? "claude asks" : "claude"} on ${path}:${line} — ${message.text}`);
      }
      notesStore.set(state.notes);
      for (const editor of liveEditors.values()) {
        editor.refreshNotes();
      }
    }

    for (const [path, file] of Object.entries(state.files)) {
      const editor = liveEditors.get(path);
      if (editor !== undefined && file.sha !== editor.sha()) {
        const fresh = await fetch("/file", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Review-Token": SERVER.token },
          body: JSON.stringify({ path }),
        })
          .then((result) => result.json())
          .catch(() => undefined);
        if (fresh !== undefined) {
          editor.applyFromDisk(fresh);
          toast(`${path} updated — diff refreshed`, "done");
        }
      }
    }
  };

  if (SERVER !== undefined) {
    setInterval(pollState, 2_000);
  }
</script>
